const $ = id => document.getElementById(id);
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const KEY = D.store || 'lines', L = D.lines;
const COLORS = ['#3b82f6', '#e8590c', '#16a34a', '#a855f7', '#db2777', '#0891b2', '#ca8a04', '#64748b'];
const colorOf = s => s ? COLORS[D.spk.indexOf(s) % COLORS.length] : 'var(--line)';
let player = null, cur = -1, LB = -1, LOOP = -1, SHADOW = false, LEAD = 0.2, SPD = 1;
try{ SHADOW = localStorage.getItem(KEY + '.shadow') === '1'; const v = parseFloat(localStorage.getItem('blocks.lead')); if(!isNaN(v)) LEAD = v; }catch(_){}
if(D.back){ $('back').href = D.back[0]; $('back').textContent = '‹ ' + D.back[1]; }
$('title').textContent = D.title; $('src').textContent = D.src || '';
$('meta').innerHTML = [`대사 ${L.length}`, `묶음 ${Math.ceil(L.length / 4)}`, D.spk.length ? `화자 ${D.spk.length}` : '화자 표시 없음'].map(x => `<span>${x}</span>`).join('');

// ---------- 묶음 · 블록 ----------
function render(){
  const box = $('groups'); box.innerHTML = '';
  for(let g = 0; g * 4 < L.length; g++){
    const grp = document.createElement('div'); grp.className = 'grp' + (LOOP === g ? ' looping' : ''); grp.id = 'g' + g;
    grp.innerHTML = `<div class="gh"><span>${fmt(L[g * 4][0])}</span><span>${g * 4 + 1}–${Math.min(L.length, g * 4 + 4)}</span>
      <button type="button" class="lp" aria-pressed="${LOOP === g}">🔁 4줄</button></div><div class="gb"></div>`;
    const gb = grp.querySelector('.gb');
    for(let i = g * 4; i < Math.min(L.length, g * 4 + 4); i++){
      const el = document.createElement('div'); el.className = 'ln' + (LB === i ? ' lp1' : ''); el.id = 'L' + i;
      el.style.setProperty('--c', colorOf(L[i][5]));
      el.innerHTML = `<span class="who" lang="ja"></span><span class="tx" lang="ja"></span>`;
      el.querySelector('.who').textContent = L[i][5] || ' ';
      el.querySelector('.tx').textContent = L[i][2];
      el.onclick = () => {
        if(el.classList.contains('now') && player && player.pauseVideo){ if(playing()) player.pauseVideo(); else go(); return; }
        if(LB >= 0) setLB(i);
        if(BB && player && player.seekTo) bbStart(i); else seek(L[i][0]);
      };
      gb.appendChild(el);
    }
    grp.querySelector('.lp').onclick = () => { LOOP = LOOP === g ? -1 : g; LB = -1; render(); paintLB(); if(LOOP === g) seek(L[g * 4][0]); };
    box.appendChild(grp);
  }
  cur = -2;
}

function playing(){ try{ return player && player.getPlayerState() === 1; }catch(_){ return false; } }
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
function paintPP(){ const on = playing(); $('ppIcon').innerHTML = on ? PAUSE : PLAY; $('pp').setAttribute('aria-label', on ? '일시정지' : '재생'); }
function go(){ cancelWait(); try{ player.playVideo(); }catch(_){} }
function seek(t){ if(!player || !player.seekTo) return; cancelWait(); doneLine = -1; player.seekTo(Math.max(0, t + .02), true); player.playVideo(); }
$('pp').onclick = () => {
  if(!player || !player.playVideo) return;
  if(playing()){ cancelWait(); player.pauseVideo(); return; }
  if(BB && !bb){ let t = 0; try{ t = player.getCurrentTime(); }catch(_){} const k = L.findIndex(l => l[1] > t); bbStart(k < 0 ? 0 : k); return; }
  if(waitT){ cancelWait(); }
  go();
};
document.addEventListener('keydown', e => {
  if(e.code !== 'Space' || /INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) return;
  e.preventDefault(); $('pp').click();
});
// 속도
function setSpeed(v){
  SPD = v; document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', Number(x.dataset.v) === v));
  $('spd').textContent = v + '×'; $('spd').setAttribute('aria-pressed', v !== 1);
  try{ player && player.setPlaybackRate(v); }catch(_){}
}
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => setSpeed(Number(b.dataset.v)));
$('spd').onclick = () => setSpeed(SPD === 1 ? .75 : SPD === .75 ? .5 : 1);
// 앞당김(노래 블록 연습과 같은 값 공유)
function paintLead(){ $('leadV').textContent = `⏱ ${LEAD.toFixed(1)}초 앞`; }
function setLead(v){ LEAD = Math.round(Math.min(.8, Math.max(0, v)) * 10) / 10; try{ localStorage.setItem('blocks.lead', LEAD); }catch(_){} paintLead(); cur = -2; }
$('leadM').onclick = () => setLead(LEAD - .1); $('leadP').onclick = () => setLead(LEAD + .1); paintLead();
// 🔁 이 줄
function paintLB(){
  document.querySelectorAll('.ln.lp1').forEach(x => x.classList.remove('lp1'));
  if(LB >= 0) $('L' + LB).classList.add('lp1');
  $('lb').setAttribute('aria-pressed', LB >= 0);
}
function setLB(i){ LB = i; if(i >= 0 && LOOP >= 0){ LOOP = -1; render(); } paintLB(); }
$('lb').onclick = () => { if(LB >= 0) setLB(-1); else { const k = cur >= 0 ? cur : 0; setLB(k); if(cur < 0) seek(L[k][0]); } };
// 🗣 따라 말하기: 대사가 끝나면 멈추고 (길이 + 0.6초) 쉰 뒤 다음으로(이 줄 반복이면 같은 줄을 다시)
let waitT = null, waitEnd = 0, doneLine = -1;
// 🪜 뒤에서부터 쌓기: 세션 = {k: 대사, step: 지금 시작 덩어리(뒤에서부터 줄어듦)}
let BB = false, bb = null;
try{ BB = localStorage.getItem(KEY + '.bb') === '1'; }catch(_){}
function paintBB(){ $('bb').setAttribute('aria-pressed', BB); $('bbTop').setAttribute('aria-pressed', BB); }
function toggleBB(){ BB = !BB; bb = null; try{ localStorage.setItem(KEY + '.bb', BB ? '1' : '0'); }catch(_){} cancelWait(); curL = -2; paintBB(); }
const chunks = k => L[k][7] || [[L[k][0]], [0]];
function bbStart(k){                                       // 이 대사를 끝 덩어리부터
  if(k < 0 || k >= L.length){ bb = null; return; }
  const [ts] = chunks(k); bb = {k, step: ts.length - 1}; curL = -2;
  cancelWait(); doneLine = -1; player.seekTo(Math.max(0, ts[bb.step] + .02), true); player.playVideo();
}
function bbEnd(){                                          // 한 단계를 다 들었다 → 쉬고 → 앞 덩어리를 붙여 다시, 다 쌓았으면 다음 대사
  const {k, step} = bb, [ts] = chunks(k);
  player.pauseVideo();
  const ms = Math.max(1200, (L[k][1] - ts[step]) * 1000 / SPD + 600);
  waitEnd = performance.now() + ms;
  waitT = setTimeout(() => { waitT = null; $('shw').textContent = '';
    if(step > 0){ bb.step = step - 1; curL = -2; player.seekTo(Math.max(0, ts[bb.step] + .02), true); player.playVideo(); }
    else bbStart(LB === k ? k : k + 1);
  }, ms);
}
function cancelWait(){ if(waitT){ clearTimeout(waitT); waitT = null; } $('shw').textContent = ''; }
function paintShadow(){ $('sh').setAttribute('aria-pressed', SHADOW); $('shTop').setAttribute('aria-pressed', SHADOW); }
function toggleShadow(){ SHADOW = !SHADOW; try{ localStorage.setItem(KEY + '.shadow', SHADOW ? '1' : '0'); }catch(_){} if(!SHADOW) cancelWait(); paintShadow(); }
$('sh').onclick = toggleShadow; $('shTop').onclick = toggleShadow; paintShadow();
$('bb').onclick = toggleBB; $('bbTop').onclick = toggleBB; paintBB();
function shadowPause(k){
  player.pauseVideo(); doneLine = k;
  const ms = Math.max(1200, (L[k][1] - L[k][0]) * 1000 / SPD + 600);
  waitEnd = performance.now() + ms;
  waitT = setTimeout(() => { waitT = null; $('shw').textContent = '';
    if(LB === k) seek(L[k][0]); else { try{ player.playVideo(); }catch(_){} } }, ms);
}

// ---------- 시각 → 지금 대사 ----------
let curL = -2;
function paintLine(tv){
  let k = L.findIndex(l => l[0] <= tv && tv < l[1]), wait = false;
  if(k < 0){ k = L.findIndex(l => l[0] > tv); wait = true; if(k < 0){ k = L.length - 1; wait = false; } }
  if(BB && bb){ k = bb.k; wait = false; }
  const key = k * 2 + (wait ? 1 : 0) + (BB && bb ? 1000 * (bb.step + 1) : 0); if(key === curL) return; curL = key;
  const [, , ja, ko, , spk, ws] = L[k];
  $('lyJa').classList.toggle('wait', wait);
  if(BB && bb){                                            // 🪜 지금 듣는 부분(뒤쪽)만 진하게
    const [ts, xs] = chunks(k), at = xs[bb.step] || 0, n = ts.length;
    $('lyJa').innerHTML = '<span class="dim"></span><span class="on"></span>';
    $('lyJa').firstChild.textContent = ja.slice(0, at); $('lyJa').lastChild.textContent = ja.slice(at);
    $('shw').dataset.bb = `🪜 ${n - bb.step}/${n}`;
  } else { $('lyJa').textContent = ja; $('shw').dataset.bb = ''; }
  $('lyKo').textContent = ko; $('nowSpk').textContent = spk || (wait ? '다음 대사' : '—');
  $('lyWs').innerHTML = ws.map(() => '<span><b lang="ja"></b><i lang="ja"></i></span>').join('');
  $('lyWs').querySelectorAll('span').forEach((el, i) => { el.querySelector('b').textContent = ws[i][0]; el.querySelector('i').textContent = ws[i][1]; el.append(ws[i][2]); });
}
function tick(){
  if(waitT){ $('shw').textContent = `${$('shw').dataset.bb ? $('shw').dataset.bb + ' · ' : ''}🗣 따라 말하기… ${Math.max(0, (waitEnd - performance.now()) / 1000).toFixed(1)}초`; }
  else if(BB && bb) $('shw').textContent = $('shw').dataset.bb + ' · 듣기';
  if(!player || !player.getCurrentTime) return;
  let t; try{ t = player.getCurrentTime(); }catch(_){ return; }
  let dur = 0; try{ dur = player.getDuration(); }catch(_){}
  $('nowT').textContent = `${fmt(t)} / ${fmt(dur || 0)}`;
  if(playing() && BB && bb){                               // 🪜 쌓기 세션: 대사 끝에서 단계를 마친다
    if(t >= L[bb.k][1] - .04){ bbEnd(); return; }
    if(t < chunks(bb.k)[0][bb.step] - 1){ bb = null; }      // 다른 데로 옮겨 갔으면 세션을 놓는다
  } else if(playing()){
    const ki = L.findIndex(l => l[0] <= t && t < l[1] + .05);           // 실제 시각의 대사(반복·따라 말하기는 앞당기지 않는다)
    if(LB >= 0){
      const [s, e] = L[LB];
      if(t >= e - .04){ if(SHADOW) shadowPause(LB); else player.seekTo(s, true); return; }   // 따라 말하기면 쉬었다가 다시 듣기
      if(t < s - 1){ player.seekTo(s, true); return; }
    } else if(LOOP >= 0){
      const s = L[LOOP * 4][0], last = L[Math.min(L.length, LOOP * 4 + 4) - 1], e = last[1];
      if(SHADOW && ki >= 0 && t >= L[ki][1] - .06 && doneLine !== ki && ki < LOOP * 4 + 4){ shadowPause(ki); return; }
      if(t >= e - .04 || t < s - 1){ doneLine = -1; player.seekTo(s, true); return; }
    } else if(SHADOW && ki >= 0 && t >= L[ki][1] - .06 && doneLine !== ki){ shadowPause(ki); return; }
  }
  const tv = t + LEAD;
  paintLine(tv);
  const k = L.findIndex(l => l[0] <= tv && tv < l[1]);
  if(k === cur) return;
  document.querySelectorAll('.ln.now').forEach(x => x.classList.remove('now'));
  cur = k; if(k < 0) return;
  const el = $('L' + k); el.classList.add('now');
  const rect = el.getBoundingClientRect(), view = innerHeight - document.querySelector('.dock').offsetHeight;
  if(rect.top < 60 || rect.bottom + rect.height * 1.5 > view) scrollBy({top: rect.top - view * .3, behavior: 'smooth'});
}
setInterval(tick, 50);

render(); paintLine(0);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {videoId: D.vid, playerVars: {playsinline: 1, rel: 0, modestbranding: 1}, events: {onStateChange: paintPP}});
};
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body></html>
