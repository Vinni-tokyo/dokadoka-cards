<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>葬送のフリーレン 미니 애니 · 학습 카드</title>
<style>
:root{--bg:#f4f5f8;--surface:#fff;--line:#e2e5ec;--line-2:#cfd4de;--ink:#21242c;--ink-2:#5c6270;--ink-3:#8b919e;
 --brand:#3b4a7a;--brand-soft:#e9ecf5;--brand-line:#c2c9df;
 font-family:"Noto Sans KR","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;font-size:14px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px 64px}
.back{font-size:12.5px;color:var(--ink-3);text-decoration:none}
.back:hover{color:var(--ink-2)}
h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:14px 0 4px}
h1 .jp{display:block;font-size:14px;font-weight:400;color:var(--ink-3);margin-top:4px}
.lead{max-width:680px;color:var(--ink-2);font-size:13.5px;line-height:1.8;word-break:keep-all;margin:14px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px;margin-top:28px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
 padding:16px 18px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(24,28,40,.04);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,28,40,.09)}
.card .ep{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 8px;display:inline-block;width:fit-content}
.card h2{margin:0;font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.card h2 .jp{display:block;font-size:12px;font-weight:400;color:var(--ink-3);margin-top:2px}
.card .meta{font-size:11.5px;color:var(--ink-3)}
footer{margin-top:40px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
</style></head><body><div class="wrap">
<a class="back" href="../index.html">← 도카도카 어학 학습으로</a>
<h1>葬送のフリーレン 미니 애니 <span class="jp">TOHO animation 공식 채널 · 「●●の魔法」 시리즈 · 21편 342장</span></h1>
<p class="lead">2023년 화제작 『장송의 프리렌』본편의 공식 미니 애니 21편(제2~22회). 화당 1~2분, 프리렌·페른 등 원작 캐릭터가 짧은 마법 개그를 펼칩니다. 등장인물이 2~3명뿐이라 자동생성 자막(수동 자막 없음)도 비교적 또렷한 편입니다.</p>
<div class="grid" id="grid"></div>
<footer>대사는 유튜브 자동생성 자막을 바탕으로 손질했습니다. 빠르거나 겹치는 대사는 오류가 있을 수 있습니다. 학습용 개인 이용을 전제로 한 페이지입니다.</footer>
</div>
