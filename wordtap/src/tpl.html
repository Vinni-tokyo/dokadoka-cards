<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#3b4a7a">
<title>듣고 탭 · 일본어 단어</title>
<style>
:root{--bg:#f4f5fa;--surface:#fff;--ink:#1d2230;--ink-2:#4a5266;--ink-3:#7c8498;--line:#e2e5ee;--brand:#3b4a7a;--brand-soft:#e9edf9;
 --ok:#1f9d55;--ok-soft:#e3f6ea;--no:#d64545;--no-soft:#fbe7e7;--fire:#e8590c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--surface:#1a1e28;--ink:#e9ecf4;--ink-2:#b7bfd0;--ink-3:#8b93a7;--line:#2a3040;--brand:#9db0ee;--brand-soft:#232b40;--ok:#4cc782;--ok-soft:#173326;--no:#ff7b7b;--no-soft:#3a1e22;--fire:#ff9b5e}}
:root[data-theme="dark"]{--bg:#11141b;--surface:#1a1e28;--ink:#e9ecf4;--ink-2:#b7bfd0;--ink-3:#8b93a7;--line:#2a3040;--brand:#9db0ee;--brand-soft:#232b40;--ok:#4cc782;--ok-soft:#173326;--no:#ff7b7b;--no-soft:#3a1e22;--fire:#ff9b5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Noto Sans KR",sans-serif;
 display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a.back{color:var(--ink-3);font-size:13px;text-decoration:none}

/* 시작 화면 */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
.home h1{margin:0;font-size:30px;letter-spacing:-.02em}
.home h1 small{display:block;font-size:14px;font-weight:500;color:var(--ink-3);margin-top:6px;letter-spacing:0}
.how{margin:0 auto;max-width:330px;color:var(--ink-2);font-size:14.5px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.barlbl{font-size:12px;color:var(--ink-3);margin-top:6px}
.go{border:0;border-radius:18px;background:var(--brand);color:#fff;font-size:22px;font-weight:800;padding:20px;box-shadow:0 8px 24px #3b4a7a40}
:root[data-theme="dark"] .go,.go{color:#fff}
@media (prefers-color-scheme:dark){.go{background:#4d5fa3}}

/* 스테이지 목록 */
.home{justify-content:flex-start;padding-top:8px}
.home h1{font-size:26px}
.how{font-size:13.5px}
.mix{border:1px dashed var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:700;color:var(--ink-2);font-size:15px}
.grp{text-align:left;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--brand);margin:8px 2px -4px}
.stages{display:grid;gap:8px;text-align:left}
.stg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.stg .t{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.stg .st{font-size:15px;letter-spacing:2px;color:var(--fire);white-space:nowrap}
.stg .st .off{color:var(--line)}
.stg{text-align:left}
.stg .bar{grid-column:1/-1;height:6px;display:block}
#eBarLbl .off{color:var(--line)}
.stg .c{grid-column:1/-1;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stg.last{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.stg.clear .t::after{content:" 클리어";font-size:11px;font-weight:800;color:var(--ok);margin-left:4px}
.stgname{font-size:12.5px;color:var(--ink-3);text-align:center;margin-bottom:-6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{margin-top:-4px}
.clearmsg{font-size:22px;font-weight:800;color:var(--fire)}

.srow{display:grid;grid-template-columns:1fr 56px;gap:6px}
.srow .stg{min-width:0}
.book{border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.book small{font-size:10.5px;color:var(--ink-3);font-weight:700}

/* 단어장 */
.bhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bhead .t{font-weight:800;font-size:16px;text-align:center}
.bctl{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px}
.bctl button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:700;font-size:14.5px}
.bctl .play{background:var(--brand);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){.bctl .play{background:#4d5fa3}}
.blist{display:flex;flex-direction:column;gap:8px;padding:10px 0 30px}
.bw{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;scroll-margin:140px}
.bw.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.bw .w{font-size:24px;font-weight:700;line-height:1.2}
.bw .w small{font-size:14px;font-weight:400;color:var(--ink-3);margin-left:8px}
.bw .m{grid-column:1/-1;font-size:15.5px;font-weight:600}
.bw .kj{grid-column:1/-1;justify-content:flex-start;min-height:0}
.bw .kj span{font-size:12.5px;padding:3px 9px}.bw .kj b{font-size:16px}
.bw .x{grid-column:1/-1;font-size:13px;color:var(--ink-3);line-height:1.55}
.bw .btns{display:flex;gap:6px;align-items:flex-start}
.bw .btns button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.bw .know[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bw.known .w,.bw.known .m{opacity:.55}

/* 게임 화면 */
.top{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.timer{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--brand);width:100%;transition:width .25s linear}
.timer.low i{background:var(--no)}
.combo{min-width:84px;text-align:right;font-weight:800;color:var(--fire);font-size:17px}
.combo.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
.score{min-width:56px;text-align:right;font-weight:700;color:var(--ink-2)}
.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 0;position:relative}
.word{font-size:clamp(40px,13vw,64px);font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.reading{font-size:17px;color:var(--ink-3);min-height:1.4em}
.kj{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
.kj span{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:99px;background:var(--brand-soft);color:var(--ink-2);font-size:14px}
.kj b{font-size:19px;color:var(--ink)}
.kj.wait{visibility:hidden}
.stars{font-size:18px;letter-spacing:4px;color:var(--fire)}
.stars .off{color:var(--line)}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:15px;color:var(--ink-2)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{min-height:76px;border:2px solid var(--line);background:var(--surface);border-radius:16px;font-size:16.5px;font-weight:600;padding:10px 8px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;transition:transform .08s}
.ch:active{transform:scale(.97)}
.ch.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ch.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.ch:disabled{cursor:default}
.flash{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;padding:4px 12px;border-radius:99px;opacity:0;transition:opacity .15s}
.flash.ok{background:var(--ok-soft);color:var(--ok);opacity:1}

/* 틀렸을 때 */
.miss{background:var(--surface);border:2px solid var(--no);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.miss .ans{font-size:18px;font-weight:800}
.miss .ans span{color:var(--no)}
.miss .ex{font-size:15px;line-height:1.6;color:var(--ink-2)}
.miss .ex mark{background:none;color:var(--ink);font-weight:800;text-decoration:underline 2px var(--fire)}
.miss .src{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:8px}
.row button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.row .next{background:var(--brand);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){.row .next{background:#4d5fa3}}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.yt>div,.yt iframe{position:absolute;inset:0;width:100%;height:100%}

/* 끝 화면 */
.end{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.big small{display:block;font-size:14px;font-weight:500;color:var(--ink-3);margin-top:8px}
.gain{font-size:18px;font-weight:700;color:var(--ok)}
.gain.zero{color:var(--ink-3);font-weight:500;font-size:15px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:600;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">

<!-- 시작 -->
<section class="home" id="home">
 <div><a class="back" href="../">‹ 도카도카 어학 학습</a></div>
 <h1>듣고 탭<small>노래·영상에서 만난 일본어 단어</small></h1>
 <p class="how">소리를 듣고, 뜻을 탭하세요.<br>탭하면 한자의 <b>뜻과 음</b>이 보입니다.<br>한 판 <b>1분</b>. 같은 단어를 <b>세 번 연달아</b> 맞히면 익힘.<br>틀린 단어는 곧 다시 나옵니다.</p>
 <div class="stats">
  <div class="stat"><b id="sToday">0</b><span>오늘 익힘</span></div>
  <div class="stat"><b id="sDue">0</b><span>복습할 단어</span></div>
  <div class="stat"><b id="sBest">0</b><span>최고 콤보</span></div>
 </div>
 <div><div class="bar"><i id="sBar"></i></div><div class="barlbl" id="sBarLbl"></div></div>
 <button class="go" id="go" type="button">▶ 시작</button>
 <button class="mix" id="mix" type="button">🔀 전체 곡에서 섞기 · 자주 나온 단어부터</button>
 <div id="stageList"></div>
</section>

<!-- 단어장 -->
<section id="browse" hidden>
 <div class="bhead">
  <div class="t" id="bTitle" lang="ja"></div>
  <div class="bctl">
   <button type="button" id="bBack">‹ 목록</button>
   <button type="button" class="play" id="bPlay">▶ 전부 듣기</button>
   <button type="button" id="bGame">게임으로 ›</button>
  </div>
 </div>
 <div class="blist" id="bList"></div>
</section>

<!-- 게임 -->
<section id="play" hidden style="flex:1;display:flex;flex-direction:column;gap:14px">
 <div class="stgname" id="pStage" lang="ja"></div>
 <div class="top">
  <div class="timer" id="timer"><i></i></div>
  <div class="combo" id="combo"></div>
  <div class="score" id="score">0</div>
 </div>
 <div class="card">
  <div class="flash" id="flash">정답!</div>
  <div class="stars" id="stars"></div>
  <div class="word" id="word" lang="ja"></div>
  <div class="reading" id="reading" lang="ja"></div>
  <div class="kj wait" id="kj"></div>
  <button class="spk" id="spk" type="button">🔊 다시 듣기</button>
 </div>
 <div class="choices" id="choices"></div>
 <div class="miss" id="miss" hidden>
  <div class="ans">정답 <span id="mAns"></span></div>
  <div class="ex" id="mEx" lang="ja"></div>
  <div class="src" id="mSrc"></div>
  <div class="yt" id="ytBox" hidden><div id="yt"></div></div>
  <div class="row">
   <button type="button" id="mSong">🎵 노래·영상에서 듣기</button>
   <button type="button" class="next" id="mNext">계속 ›</button>
  </div>
 </div>
</section>

<!-- 끝 -->
<section class="end" id="end" hidden>
 <div class="clearmsg" id="eClear" hidden>🎉 스테이지 클리어!</div>
 <div class="stgname" id="eStage" lang="ja"></div>
 <div class="big" id="eScore">0<small>점</small></div>
 <div class="gain" id="eGain"></div>
 <div class="stats">
  <div class="stat"><b id="eRight">0</b><span>맞힘</span></div>
  <div class="stat"><b id="eCombo">0</b><span>최고 콤보</span></div>
  <div class="stat"><b id="eTotal">0</b><span id="eTotalL">누적 익힘</span></div>
 </div>
 <div class="sbar"><div class="bar"><i id="eBar"></i></div><div class="barlbl" id="eBarLbl"></div></div>
 <button class="go" id="again" type="button">한 판 더</button>
 <button class="ghost" id="toHome" type="button">스테이지 고르기</button>
</section>

</div>
<script>
const WORDS = /*__WORDS__*/[];
const STAGES = /*__STAGES__*/[];                          // 곡 하나 = 스테이지 하나 {k, t, g, ids}
const ROUND = 60, NEED = 3, GAPS = [1, 3, 7, 21];          // 초 · 연달아 맞힐 횟수 · 익힘 뒤 다시 볼 날
const DAY = 864e5, $ = id => document.getElementById(id);

/* ---------- 저장 (폰 안에만) ---------- */
const KEY = 'wordtap.v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_){ return {}; } }
let ST = load(); ST.w = ST.w || {}; ST.best = ST.best || 0; ST.day = ST.day || {};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(_){} }
const today = () => new Date().toLocaleDateString('sv');
const rec = id => (ST.w[id] = ST.w[id] || {s: 0, lv: 0, due: 0, seen: 0});
const learned = () => Object.values(ST.w).filter(r => r.lv > 0).length;
const dueCount = () => Object.values(ST.w).filter(r => r.lv > 0 && r.due <= Date.now()).length;

const stageOf = k => STAGES.find(s => s.k === k) || null;
const stageLearned = s => s.ids.filter(id => ST.w[id] && ST.w[id].lv > 0).length;
function starsHtml(n, tot){
  const k = n >= tot ? 3 : n >= tot * 2 / 3 ? 2 : n >= tot / 3 ? 1 : 0;
  return [0, 1, 2].map(i => i < k ? '★' : '<span class="off">★</span>').join('');
}
function paintHome(){
  $('sToday').textContent = ST.day[today()] || 0;
  $('sDue').textContent = dueCount();
  $('sBest').textContent = ST.best;
  const n = learned(); $('sBar').style.width = (n / WORDS.length * 100).toFixed(1) + '%';
  $('sBarLbl').textContent = `익힌 단어 ${n} / ${WORDS.length}`;
  const last = stageOf(ST.last);
  $('go').textContent = last ? `▶ 이어서 · ${last.t}` : '▶ 시작 · 전체 곡';
  const box = $('stageList'); box.innerHTML = '';
  for(const g of ['노래', '찬양', '애니·영상']){
    const list = STAGES.filter(s => s.g === g); if(!list.length) continue;
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = `${g} · ${list.length}`; box.appendChild(h);
    const wrap = document.createElement('div'); wrap.className = 'stages'; box.appendChild(wrap);
    for(const s of list){
      const k = stageLearned(s), tot = s.ids.length;
      const row = document.createElement('div'); row.className = 'srow';
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'stg' + (s.k === ST.last ? ' last' : '') + (k >= tot ? ' clear' : '');
      b.innerHTML = `<span class="t" lang="ja"></span><span class="st">${starsHtml(k, tot)}</span>
        <span class="bar"><i style="width:${(k / tot * 100).toFixed(1)}%"></i></span><span class="c">익힘 ${k} / ${tot}</span>`;
      b.querySelector('.t').textContent = s.t;
      b.onclick = () => start(s.k);
      const bk = document.createElement('button'); bk.type = 'button'; bk.className = 'book';
      bk.innerHTML = '📖<small>단어장</small>'; bk.setAttribute('aria-label', s.t + ' 단어장');
      bk.onclick = () => openBook(s.k);
      row.append(b, bk); wrap.appendChild(row);
    }
  }
}

/* ---------- 문제 고르기 ---------- */
// 복습할 때가 된 단어 → 익히는 중인 단어 → 새 단어(여러 곡에 나온 것부터) 순으로 섞는다
let STAGE = null;                                         // 지금 스테이지(없으면 전체에서 섞기)
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQueue(){
  const pool = STAGE ? STAGE.ids.map(id => WORDS[id]) : WORDS;   // 스테이지면 그 곡 단어만, 가사에 나온 차례
  const now = Date.now(), due = [], doing = [], fresh = [];
  for(const w of pool){
    const r = ST.w[w.id];
    if(!r) fresh.push(w);
    else if(r.lv > 0 && r.due <= now) due.push(w);
    else if(r.lv === 0) doing.push(w);
  }
  due.sort((a, b) => ST.w[a.id].due - ST.w[b.id].due);
  const q = shuffle([...due.slice(0, 12), ...doing.slice(0, 10)]);
  // 새 단어는 차례를 지키며 사이사이에 끼운다(스테이지면 가사 순서대로 만난다)
  let pos = 0;
  for(const w of fresh.slice(0, Math.max(4, 16 - q.length))){
    pos = Math.min(q.length, pos + 1 + (Math.random() * 2 | 0)); q.splice(pos, 0, w); pos++;
  }
  if(!q.length) q.push(...shuffle(pool.slice()).slice(0, 20));   // 다 익힌 스테이지: 연습으로 다시
  return q;
}
function pick(w){
  const seen = new Set([w.m]), out = [w.m];
  const pool = WORDS.filter(x => Math.abs(x.id - w.id) < 400);  // 비슷한 빈도의 단어에서
  while(out.length < 4){
    const x = (Math.random() < .8 ? pool : WORDS)[Math.random() * (Math.random() < .8 ? pool.length : WORDS.length) | 0];
    if(x && !seen.has(x.m)){ seen.add(x.m); out.push(x.m); }
  }
  for(let i = 3; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

/* ---------- 소리 ---------- */
let AC = null, cur = null;
function ac(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(_){} return AC; }
function beep(ok){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
  o.type = ok ? 'triangle' : 'square'; const t = c.currentTime;
  if(ok){ o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + .07); }
  else o.frequency.setValueAtTime(180, t);
  g.gain.setValueAtTime(ok ? .18 : .09, t); g.gain.exponentialRampToValueAtTime(.001, t + (ok ? .22 : .3));
  o.start(t); o.stop(t + .32);
}
function say(w){
  try{ if(cur){ cur.pause(); } }catch(_){}
  if(w.a){ cur = new Audio('audio/' + w.a); cur.play().catch(() => tts(w)); }
  else tts(w);
}
function tts(w){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w.r); u.lang = 'ja-JP'; u.rate = .9; speechSynthesis.speak(u);
}

/* ---------- 원곡 소절 ---------- */
let YT_READY = null, player = null, stopT = null;
function ytApi(){
  if(YT_READY) return YT_READY;
  YT_READY = new Promise(res => { window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); });
  return YT_READY;
}
async function playSong(ex){
  $('ytBox').hidden = false;
  await ytApi();
  const go = () => { player.loadVideoById({videoId: ex.v, startSeconds: Math.max(0, ex.s - .3), endSeconds: ex.e + .4}); };
  if(player) go();
  else player = new YT.Player('yt', {playerVars: {playsinline: 1, controls: 0, rel: 0, modestbranding: 1}, events: {onReady: go}});
}
function stopSong(){ try{ if(player) player.stopVideo(); }catch(_){} $('ytBox').hidden = true; }

/* ---------- 한 판 ---------- */
let Q, w, left, tick, score, combo, best, right, gainedNow, paused, clearedBefore;
function start(k){
  ac();
  STAGE = k ? stageOf(k) : null; ST.last = k || ''; save();
  clearedBefore = STAGE ? stageLearned(STAGE) >= STAGE.ids.length : false;
  $('pStage').textContent = STAGE ? STAGE.t : '전체 곡에서 섞기';
  Q = buildQueue(); score = 0; combo = 0; best = 0; right = 0; gainedNow = 0; left = ROUND; paused = false;
  $('home').hidden = true; $('end').hidden = true; $('play').hidden = false;
  $('score').textContent = 0; $('combo').textContent = '';
  clearInterval(tick); tick = setInterval(() => { if(paused) return; left -= .25; paintTimer(); if(left <= 0) finish(); }, 250);
  paintTimer(); next();
}
function paintTimer(){ $('timer').firstElementChild.style.width = Math.max(0, left / ROUND * 100) + '%'; $('timer').classList.toggle('low', left <= 10); }
function next(){
  if(!Q.length) Q = buildQueue();
  paused = false;
  w = Q.shift(); const r = rec(w.id);
  $('word').textContent = w.w;
  $('reading').textContent = w.r;
  $('stars').innerHTML = [0, 1, 2].map(i => i < r.s ? '★' : '<span class="off">★</span>').join('');
  $('miss').hidden = true; $('choices').hidden = false;
  const kj = $('kj'); kj.className = 'kj wait';
  kj.innerHTML = (w.k || []).map(([c, h]) => `<span><b lang="ja">${c}</b>${h}</span>`).join('');
  const box = $('choices'); box.innerHTML = '';
  for(const m of pick(w)){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ch'; b.textContent = m;
    b.onclick = () => answer(b, m === w.m); box.appendChild(b);
  }
  say(w);
}
function answer(btn, ok){
  const r = rec(w.id); r.seen++;
  document.querySelectorAll('.ch').forEach(b => { b.disabled = true; if(b.textContent === w.m) b.classList.add('ok'); });
  $('kj').className = 'kj';                                // 탭한 뒤에 한자 훈음을 보여 준다
  if(ok){
    beep(true); right++; combo++; best = Math.max(best, combo);
    score += 10 * (1 + Math.floor(combo / 5));
    r.s++;
    if(r.s >= NEED){                                       // 익힘 → 며칠 뒤 다시
      if(r.lv === 0){ gainedNow++; ST.day[today()] = (ST.day[today()] || 0) + 1; }
      r.lv = Math.min(r.lv + 1, GAPS.length); r.s = 0; r.due = Date.now() + GAPS[r.lv - 1] * DAY;
    } else Q.splice(Math.min(Q.length, 3 + (Math.random() * 3 | 0)), 0, w);   // 몇 문제 뒤 다시
    $('score').textContent = score;
    const c = $('combo'); c.textContent = combo >= 2 ? `🔥 ${combo}` : ''; c.classList.remove('pop'); void c.offsetWidth; if(combo >= 2) c.classList.add('pop');
    $('flash').className = 'flash ok'; setTimeout(() => $('flash').className = 'flash', 350);
    paused = true;                                         // 훈음을 보는 동안은 시계를 멈춘다
    save(); setTimeout(next, (w.k && w.k.length) ? 1000 : 380);   // 한자가 있으면 훈음을 볼 시간
  } else {
    beep(false); try{ navigator.vibrate && navigator.vibrate(120); }catch(_){}
    btn.classList.add('no'); combo = 0; $('combo').textContent = '';
    r.s = 0; if(r.lv > 0){ r.lv--; r.due = 0; }
    Q.splice(Math.min(Q.length, 2), 0, w);                 // 곧 다시
    save(); showMiss();
  }
}
function showMiss(){
  paused = true;
  setTimeout(() => {
    $('choices').hidden = true; $('miss').hidden = false;
    $('mAns').textContent = w.m;
    // 스테이지에서 하면 그 곡에 나온 줄, 아니면 처음 찾은 줄
    const si = STAGE ? STAGES.indexOf(STAGE) : -1, sx = si >= 0 && w.x && w.x[si];
    const ex = sx ? {t: sx[0], s: sx[1], e: sx[2], v: STAGE.v, song: STAGE.t} : w.ex;
    curEx = ex;
    if(ex){
      const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
      let t = esc(ex.t); const stem = [w.w, w.w.replace(/[ぁ-ゖ]+$/, '')].find(s => s && ex.t.includes(s));
      if(stem) t = t.replace(esc(stem), '<mark>' + esc(stem) + '</mark>');
      $('mEx').innerHTML = t; $('mSrc').textContent = '♪ ' + ex.song; $('mSong').hidden = false;
    } else { $('mEx').textContent = ''; $('mSrc').textContent = ''; $('mSong').hidden = true; }
    say(w);
  }, 650);
}
let curEx = null;
$('mSong').onclick = () => curEx && playSong(curEx);
$('mNext').onclick = () => { stopSong(); paused = false; next(); };
$('spk').onclick = () => say(w);
function finish(){
  clearInterval(tick); stopSong();
  if(best > ST.best) ST.best = best; save();
  $('play').hidden = true; $('end').hidden = false;
  $('eScore').innerHTML = score + '<small>점</small>';
  const g = $('eGain'); g.className = 'gain' + (gainedNow ? '' : ' zero');
  g.textContent = gainedNow ? `새로 익힌 단어 +${gainedNow}` : '세 번 연달아 맞히면 「익힘」이 됩니다';
  $('eRight').textContent = right; $('eCombo').textContent = best;
  $('eStage').textContent = STAGE ? STAGE.t : '전체 곡에서 섞기';
  const tot = STAGE ? STAGE.ids.length : WORDS.length, k = STAGE ? stageLearned(STAGE) : learned();
  $('eTotal').textContent = k; $('eTotalL').textContent = STAGE ? '이 곡 익힘' : '누적 익힘';
  $('eBar').style.width = (k / tot * 100).toFixed(1) + '%';
  $('eBarLbl').innerHTML = `<span style="color:var(--fire);letter-spacing:2px">${starsHtml(k, tot)}</span> ${k} / ${tot}`;
  $('eClear').hidden = !(STAGE && !clearedBefore && k >= tot);
}
/* ---------- 단어장: 곡의 단어를 차례대로 훑어보기 ---------- */
let BOOK = null, bTimer = null, bIdx = -1;
const bAudio = new Audio();                                // 하나를 돌려 써야 폰에서 이어 재생이 막히지 않는다
function exFor(w, st){
  const si = STAGES.indexOf(st), sx = si >= 0 && w.x && w.x[si];
  return sx ? sx[0] : (w.ex ? w.ex.t : '');
}
function openBook(k){
  BOOK = stageOf(k); ST.last = k; save();
  $('home').hidden = true; $('browse').hidden = false; window.scrollTo(0, 0);
  $('bTitle').textContent = BOOK.t;
  const list = $('bList'); list.innerHTML = '';
  BOOK.ids.forEach((id, i) => {
    const w = WORDS[id], r = ST.w[id], known = !!(r && r.lv > 0);
    const d = document.createElement('div'); d.className = 'bw' + (known ? ' known' : ''); d.id = 'bw' + i;
    d.innerHTML = `<div class="w" lang="ja"></div><div class="btns"><button type="button" class="spk1">🔊</button>
      <button type="button" class="know" aria-pressed="${known}">${known ? '✓ 익힘' : '✓ 알아요'}</button></div>
      <div class="m"></div><div class="kj"></div><div class="x" lang="ja"></div>`;
    d.querySelector('.w').innerHTML = `${w.w}<small>${w.r}</small>`;
    d.querySelector('.m').textContent = w.m;
    d.querySelector('.kj').innerHTML = (w.k || []).map(([c, h]) => `<span><b lang="ja">${c}</b>${h}</span>`).join('');
    const x = exFor(w, BOOK); d.querySelector('.x').textContent = x ? '♪ ' + x : '';
    d.querySelector('.spk1').onclick = () => { bStop(); bSay(w); };
    d.querySelector('.know').onclick = e => toggleKnown(w, d, e.currentTarget);
    list.appendChild(d);
  });
}
function toggleKnown(w, d, btn){
  const r = rec(w.id);
  if(r.lv > 0){ r.lv = 0; r.s = 0; r.due = 0; }            // 되돌리기
  else {                                                    // 알아요 → 익힘, 내일 한 번 확인
    r.lv = 1; r.s = 0; r.due = Date.now() + DAY;
    ST.day[today()] = (ST.day[today()] || 0) + 1;
  }
  const on = r.lv > 0; btn.setAttribute('aria-pressed', on); btn.textContent = on ? '✓ 익힘' : '✓ 알아요';
  d.classList.toggle('known', on); save();
}
function bSay(w, done){
  bAudio.onended = bAudio.onerror = null;
  if(w.a){ bAudio.src = 'audio/' + w.a; bAudio.onended = () => done && done(); bAudio.onerror = () => { tts(w); done && setTimeout(done, 900); };
           bAudio.play().catch(() => { tts(w); done && setTimeout(done, 900); }); }
  else { tts(w); done && setTimeout(done, 900); }
}
function bStop(){ clearTimeout(bTimer); bIdx = -1; try{ bAudio.pause(); }catch(_){} document.querySelectorAll('.bw.on').forEach(e => e.classList.remove('on')); $('bPlay').textContent = '▶ 전부 듣기'; }
function bStep(i){
  if(!BOOK || i >= BOOK.ids.length){ bStop(); return; }
  bIdx = i; document.querySelectorAll('.bw.on').forEach(e => e.classList.remove('on'));
  const d = $('bw' + i); d.classList.add('on'); d.scrollIntoView({block: 'center', behavior: 'smooth'});
  bSay(WORDS[BOOK.ids[i]], () => { if(bIdx === i) bTimer = setTimeout(() => bStep(i + 1), 900); });
}
$('bPlay').onclick = () => { if(bIdx >= 0){ bStop(); return; } ac(); $('bPlay').textContent = '■ 멈춤'; bStep(0); };
$('bBack').onclick = () => { bStop(); $('browse').hidden = true; $('home').hidden = false; paintHome(); };
$('bGame').onclick = () => { bStop(); $('browse').hidden = true; start(BOOK.k); };

$('go').onclick = () => start(stageOf(ST.last) ? ST.last : '');
$('mix').onclick = () => start('');
$('again').onclick = () => start(STAGE ? STAGE.k : '');
$('toHome').onclick = () => { $('end').hidden = true; $('home').hidden = false; paintHome(); };
paintHome();
</script>
</body></html>
