<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#3b4a7a">
<title>듣고 탭 · 일본어 단어</title>
<style>
:root{--bg:#f4f5fa;--surface:#fff;--ink:#1d2230;--ink-2:#4a5266;--ink-3:#7c8498;--line:#e2e5ee;--brand:#3b4a7a;--brand-soft:#e9edf9;
 --ok:#1f9d55;--ok-soft:#e3f6ea;--no:#d64545;--no-soft:#fbe7e7;--fire:#e8590c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--surface:#1a1e28;--ink:#e9ecf4;--ink-2:#b7bfd0;--ink-3:#8b93a7;--line:#2a3040;--brand:#9db0ee;--brand-soft:#232b40;--ok:#4cc782;--ok-soft:#173326;--no:#ff7b7b;--no-soft:#3a1e22;--fire:#ff9b5e}}
:root[data-theme="dark"]{--bg:#11141b;--surface:#1a1e28;--ink:#e9ecf4;--ink-2:#b7bfd0;--ink-3:#8b93a7;--line:#2a3040;--brand:#9db0ee;--brand-soft:#232b40;--ok:#4cc782;--ok-soft:#173326;--no:#ff7b7b;--no-soft:#3a1e22;--fire:#ff9b5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP","Noto Sans KR",sans-serif;
 display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a.back{color:var(--ink-3);font-size:13px;text-decoration:none}

/* 시작 화면 */
.home{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center}
.home h1{margin:0;font-size:30px;letter-spacing:-.02em}
.home h1 small{display:block;font-size:14px;font-weight:500;color:var(--ink-3);margin-top:6px;letter-spacing:0}
.how{margin:0 auto;max-width:330px;color:var(--ink-2);font-size:14.5px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.barlbl{font-size:12px;color:var(--ink-3);margin-top:6px}
.go{border:0;border-radius:18px;background:var(--brand);color:#fff;font-size:22px;font-weight:800;padding:20px;box-shadow:0 8px 24px #3b4a7a40}
:root[data-theme="dark"] .go,.go{color:#fff}
@media (prefers-color-scheme:dark){.go{background:#4d5fa3}}

/* 스테이지 목록 */
.home{justify-content:flex-start;padding-top:8px}
.home h1{font-size:26px}
.how{font-size:13.5px}
.mix{border:1px dashed var(--line);background:var(--surface);border-radius:14px;padding:13px;font-weight:700;color:var(--ink-2);font-size:15px}
.grp{text-align:left;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--brand);margin:8px 2px -4px}
.stages{display:grid;gap:8px;text-align:left}
.stg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.stg .t{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.stg .st{font-size:15px;letter-spacing:2px;color:var(--fire);white-space:nowrap}
.stg .st .off{color:var(--line)}
.stg{text-align:left}
.stg .bar{grid-column:1/-1;height:6px;display:block}
#eBarLbl .off{color:var(--line)}
.stg .c{grid-column:1/-1;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stg.last{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.stg.clear .t::after{content:" 클리어";font-size:11px;font-weight:800;color:var(--ok);margin-left:4px}
.stgname{font-size:12.5px;color:var(--ink-3);text-align:center;margin-bottom:-6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar{margin-top:-4px}
.clearmsg{font-size:22px;font-weight:800;color:var(--fire)}

.srow{display:grid;grid-template-columns:1fr 56px;gap:6px}
.srow .stg{min-width:0}
.book{border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.book small{font-size:10.5px;color:var(--ink-3);font-weight:700}

/* 단어장 */
.bhead{position:sticky;top:0;z-index:2;background:var(--bg);padding:4px 0 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bhead .t{font-weight:800;font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btop{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px}
.btop #bBack{border:0;background:none;font-size:26px;line-height:1;padding:4px 6px;color:var(--ink-2)}
.btop .rev{border:1.5px solid var(--brand);color:var(--brand);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:800;font-size:14.5px}
.bctl{display:grid;grid-template-columns:1fr auto 46px 46px;gap:6px}
.bctl .ico{padding:0;font-size:18px}
.bctl .ico[aria-expanded="true"]{background:var(--brand-soft);border-color:var(--brand)}
.bctl button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-weight:700;font-size:14.5px}
.bctl .play{background:var(--brand);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){.bctl .play{background:#4d5fa3}}
.bopt{display:flex;justify-content:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.bopt label{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer}
.bopt input{width:16px;height:16px;accent-color:var(--brand)}
.blist{display:flex;flex-direction:column;gap:8px;padding:10px 0 30px}
.bw{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;scroll-margin:170px}
.bw.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.bw .bh{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 0 16px}
.bw .no{font-size:13px;font-weight:800;color:var(--brand)}
.bw .bm{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-3);border-radius:50%}
.bw .bm svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.bw .bm[aria-pressed="true"]{color:var(--fire)}.bw .bm[aria-pressed="true"] svg{fill:currentColor}
.bw .w{font-size:36px;font-weight:700;line-height:1.2;text-align:center;padding:0 16px;cursor:pointer}
.bw .rrow{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:2px 6px 8px}
.bw .r{text-align:center;font-size:18px;color:var(--ink-2);cursor:pointer}
.bw .spk1,.bw .fold{border:0;background:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:var(--ink-2)}
.bw .fold svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;transition:transform .2s}
.bw.open .fold svg,.blist.all .fold svg{transform:rotate(180deg)}
.bw .body{display:none;flex-direction:column;align-items:center;gap:10px;background:var(--brand-soft);padding:14px 14px 14px;text-align:center}
.bw.open .body,.blist.all .bw .body,.bw.peek .body{display:flex}
.bw .m{font-size:20px;font-weight:800}
.bw .kj{justify-content:center;min-height:0}
.bw .kj span{font-size:12.5px;padding:3px 9px}.bw .kj b{font-size:16px}
.bw .ex{width:100%;display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;text-align:left;background:var(--surface);border-radius:12px;padding:10px 8px 10px 12px}
.bw .ex .ej{font-size:16px;line-height:2.05}
.bw .ex rt{font-size:10.5px;font-weight:400;color:var(--ink-3)}
.bw .ex .ej mark{background:none;color:inherit;font-weight:800;text-decoration:underline 2px var(--fire);text-underline-offset:3px}
.bw .ex .er{font-size:12px;color:var(--ink-3);line-height:1.5}
.bw .ex .ek{font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.5}
.bw .ex .song{grid-column:2;grid-row:1/4;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:18px}
.bw .ex .src{grid-column:1/-1;font-size:11.5px;color:var(--ink-3)}
.bw .know{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:700}
.bw .know[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bw.known .w,.bw.known .r{opacity:.5}
.bw.known .w,.bw.known .m{opacity:.55}

/* 게임 화면 */
.top{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.timer{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--brand);width:100%;transition:width .25s linear}
.timer.low i{background:var(--no)}
.combo{min-width:84px;text-align:right;font-weight:800;color:var(--fire);font-size:17px}
.combo.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
.score{min-width:56px;text-align:right;font-weight:700;color:var(--ink-2)}
.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 0;position:relative}
.word{font-size:clamp(40px,13vw,64px);font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.reading{font-size:17px;color:var(--ink-3);min-height:1.4em}
/* ★ 가 늘면 글자가 하나씩 사라진다: ★1 읽기 숨김 → ★2 소리만 */
.card.hideR .reading,.card.ear .reading{visibility:hidden}
.card.ear .word{color:transparent;position:relative}
.card.ear .word::after{content:"👂";color:var(--ink);position:absolute;inset:0;display:grid;place-items:center;font-size:.9em}
.lvl{font-size:12.5px;font-weight:700;color:var(--brand);min-height:1.2em}
.kj{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
.kj span{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border-radius:99px;background:var(--brand-soft);color:var(--ink-2);font-size:14px}
.kj b{font-size:19px;color:var(--ink)}
.kj.wait{visibility:hidden}
.stars{font-size:18px;letter-spacing:4px;color:var(--fire)}
.stars .off{color:var(--line)}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-size:15px;color:var(--ink-2)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{min-height:76px;border:2px solid var(--line);background:var(--surface);border-radius:16px;font-size:16.5px;font-weight:600;padding:10px 8px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere;transition:transform .08s}
.ch:active{transform:scale(.97)}
.ch.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ch.no{border-color:var(--no);background:var(--no-soft);color:var(--no)}
.ch:disabled{cursor:default}
.flash{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;padding:4px 12px;border-radius:99px;opacity:0;transition:opacity .15s}
.flash.ok{background:var(--ok-soft);color:var(--ok);opacity:1}

/* 틀렸을 때 */
.miss{background:var(--surface);border:2px solid var(--no);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.miss .ans{font-size:18px;font-weight:800}
.miss .ans span{color:var(--no)}
.miss .ex{font-size:15px;line-height:1.6;color:var(--ink-2)}
.miss .ex mark{background:none;color:var(--ink);font-weight:800;text-decoration:underline 2px var(--fire)}
.miss .src{font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:8px}
.row button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.row .next{background:var(--brand);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){.row .next{background:#4d5fa3}}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.yt>div,.yt iframe{position:absolute;inset:0;width:100%;height:100%}
.ex>.yt,.mi>.yt{grid-column:1/-1;margin-top:6px}

/* 목숨 · 문제 시간 · 손맛 */
.lives{font-size:18px;letter-spacing:2px;min-width:64px}
.lives .off{filter:grayscale(1);opacity:.25}
.qbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:-6px}
.qbar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear}
.qbar.mid i{background:var(--fire)}.qbar.low i{background:var(--no)}
.float{position:absolute;left:76%;top:16%;transform:translateX(-50%);font-size:30px;font-weight:900;color:var(--ok);pointer-events:none;opacity:0}
.float.fly{animation:up .7s ease-out}
@keyframes up{0%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.flash.no{background:var(--no-soft);color:var(--no);opacity:1}
.card.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.record{font-size:15px;font-weight:800;color:var(--fire)}
.record.plain{color:var(--ink-3);font-weight:600}
.mlist{text-align:left;display:flex;flex-direction:column;gap:6px}
.mlist h3{margin:4px 2px;font-size:13px;color:var(--ink-3)}
.mi{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.mi b{font-size:18px}.mi small{color:var(--ink-3);margin-left:6px}
.mi .mm{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.mi button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 9px;font-size:13px}

/* 단어장 옵션 · 잠금 */
.bopt{flex-wrap:wrap;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.bopt button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.veil{position:fixed;inset:0;z-index:50;background:#0b0e15ee;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;user-select:none;-webkit-user-select:none;touch-action:none}
.veil b{font-size:44px}.veil p{margin:0;font-size:15px;opacity:.85}
.veil .hold{width:200px;height:8px;border-radius:99px;background:#ffffff30;overflow:hidden}
.veil .hold i{display:block;height:100%;width:0;background:#fff}
.veil .now{font-size:30px;font-weight:700;min-height:1.3em}

/* 끝 화면 */
.end{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.big small{display:block;font-size:14px;font-weight:500;color:var(--ink-3);margin-top:8px}
.gain{font-size:18px;font-weight:700;color:var(--ok)}
.gain.zero{color:var(--ink-3);font-weight:500;font-size:15px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-weight:600;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">

<!-- 시작 -->
<section class="home" id="home">
 <div><a class="back" href="../">‹ 도카도카 어학 학습</a></div>
 <h1>듣고 탭<small>노래·영상에서 만난 일본어 단어</small></h1>
 <p class="how">소리를 듣고, 뜻을 탭하세요.<br>탭하면 한자의 <b>뜻과 음</b>이 보입니다.<br>목숨 <b>❤️ 3개</b>, 문제마다 <b>5초</b>. 빨리 맞힐수록 점수가 커요.<br> 같은 단어를 <b>세 번 연달아</b> 맞히면 익힘.<br>★ 하나면 <b>읽기가 숨고</b>, ★ 둘이면 <b>소리만</b> 나와요.<br>틀린 단어는 곧 다시 나옵니다.</p>
 <div class="stats">
  <div class="stat"><b id="sToday">0</b><span>오늘 익힘</span></div>
  <div class="stat"><b id="sDue">0</b><span>복습할 단어</span></div>
  <div class="stat"><b id="sBest">0</b><span>최고 콤보</span></div>
 </div>
 <div><div class="bar"><i id="sBar"></i></div><div class="barlbl" id="sBarLbl"></div></div>
 <button class="go" id="go" type="button">▶ 시작</button>
 <button class="mix" id="mix" type="button">🔀 전체 곡에서 섞기 · 자주 나온 단어부터</button>
 <div id="stageList"></div>
</section>

<!-- 단어장 -->
<section id="browse" hidden>
 <div class="bhead">
  <div class="btop">
   <button type="button" id="bBack" aria-label="스테이지 목록으로">‹</button>
   <div class="t" id="bTitle" lang="ja"></div>
   <button type="button" class="rev" id="bGame">복습 ›</button>
  </div>
  <div class="bctl">
   <button type="button" class="play" id="bPlay">▶ 전부 듣기</button>
   <button type="button" id="bOpen" aria-pressed="false">펼치기</button>
   <button type="button" class="ico" id="bSet" aria-expanded="false" aria-controls="bOpt" aria-label="듣기 설정">⚙</button>
   <button type="button" class="ico" id="bLock" aria-label="화면 잠금">🔒</button>
  </div>
  <div class="bopt" id="bOpt" hidden>
   <button type="button" id="oRep">🔁 1번씩</button>
   <label><input type="checkbox" id="bMean" checked> 🇰🇷 뜻</label>
   <label><input type="checkbox" id="oShadow"> 🗣 따라하기</label>
   <button type="button" id="oOnly">전체</button>
   <label><input type="checkbox" id="oLoop"> ♾ 계속</label>
  </div>
 </div>
 <div class="blist" id="bList"></div>
</section>

<!-- 게임 -->
<section id="play" hidden style="flex:1;display:flex;flex-direction:column;gap:14px">
 <div class="stgname" id="pStage" lang="ja"></div>
 <div class="top">
  <div class="lives" id="lives"></div>
  <div style="flex:1"></div>
  <div class="combo" id="combo"></div>
  <div class="score" id="score">0</div>
 </div>
 <div class="qbar" id="qbar"><i></i></div>
 <div class="card" id="card">
  <div class="flash" id="flash">정답!</div>
  <div class="float" id="float"></div>
  <div class="stars" id="stars"></div>
  <div class="lvl" id="lvl"></div>
  <div class="word" id="word" lang="ja"></div>
  <div class="reading" id="reading" lang="ja"></div>
  <div class="kj wait" id="kj"></div>
  <button class="spk" id="spk" type="button">🔊 다시 듣기</button>
 </div>
 <div class="choices" id="choices"></div>
</section>

<!-- 끝 -->
<section class="end" id="end" hidden>
 <div class="clearmsg" id="eClear" hidden>🎉 스테이지 클리어!</div>
 <div class="stgname" id="eStage" lang="ja"></div>
 <div class="big" id="eScore">0<small>점</small></div>
 <div class="record" id="eRecord"></div>
 <div class="gain" id="eGain"></div>
 <div class="stats">
  <div class="stat"><b id="eRight">0</b><span>맞힘</span></div>
  <div class="stat"><b id="eCombo">0</b><span>최고 콤보</span></div>
  <div class="stat"><b id="eTotal">0</b><span id="eTotalL">누적 익힘</span></div>
 </div>
 <div class="sbar"><div class="bar"><i id="eBar"></i></div><div class="barlbl" id="eBarLbl"></div></div>
 <button class="go" id="again" type="button">한 판 더</button>
 <button class="ghost" id="toHome" type="button">스테이지 고르기</button>
 <div class="mlist" id="eMiss"></div>
</section>

<!-- 화면 잠금 -->
<div class="veil" id="veil" hidden>
 <div class="now" id="vNow" lang="ja"></div>
 <b>🔒</b>
 <p>2초 동안 꾹 눌러 풀기</p>
 <div class="hold"><i id="vHold"></i></div>
</div>

</div>
<script>
const WORDS = /*__WORDS__*/[];
const STAGES = /*__STAGES__*/[];                          // 곡 하나 = 스테이지 하나 {k, t, g, ids}
const NEED = 3, GAPS = [1, 3, 7, 21];                      // 연달아 맞힐 횟수 · 익힘 뒤 다시 볼 날
const DAY = 864e5, $ = id => document.getElementById(id);

/* ---------- 저장 (폰 안에만) ---------- */
const KEY = 'wordtap.v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_){ return {}; } }
let ST = load(); ST.w = ST.w || {}; ST.best = ST.best || 0; ST.day = ST.day || {}; ST.bm = ST.bm || {};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(_){} }
const today = () => new Date().toLocaleDateString('sv');
const rec = id => (ST.w[id] = ST.w[id] || {s: 0, lv: 0, due: 0, seen: 0});
const learned = () => Object.values(ST.w).filter(r => r.lv > 0).length;
const dueCount = () => Object.values(ST.w).filter(r => r.lv > 0 && r.due <= Date.now()).length;

const stageOf = k => STAGES.find(s => s.k === k) || null;
const stageLearned = s => s.ids.filter(id => ST.w[id] && ST.w[id].lv > 0).length;
function starsHtml(n, tot){
  const k = n >= tot ? 3 : n >= tot * 2 / 3 ? 2 : n >= tot / 3 ? 1 : 0;
  return [0, 1, 2].map(i => i < k ? '★' : '<span class="off">★</span>').join('');
}
function paintHome(){
  $('sToday').textContent = ST.day[today()] || 0;
  $('sDue').textContent = dueCount();
  $('sBest').textContent = ST.best;
  const n = learned(); $('sBar').style.width = (n / WORDS.length * 100).toFixed(1) + '%';
  $('sBarLbl').textContent = `익힌 단어 ${n} / ${WORDS.length}`;
  const last = stageOf(ST.last);
  $('go').textContent = last ? `▶ 이어서 · ${last.t}` : '▶ 시작 · 전체 곡';
  const box = $('stageList'); box.innerHTML = '';
  for(const g of ['노래', '찬양', '애니·영상']){
    const list = STAGES.filter(s => s.g === g); if(!list.length) continue;
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = `${g} · ${list.length}`; box.appendChild(h);
    const wrap = document.createElement('div'); wrap.className = 'stages'; box.appendChild(wrap);
    for(const s of list){
      const k = stageLearned(s), tot = s.ids.length;
      const row = document.createElement('div'); row.className = 'srow';
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'stg' + (s.k === ST.last ? ' last' : '') + (k >= tot ? ' clear' : '');
      b.innerHTML = `<span class="t" lang="ja"></span><span class="st">${starsHtml(k, tot)}</span>
        <span class="bar"><i style="width:${(k / tot * 100).toFixed(1)}%"></i></span><span class="c">익힘 ${k} / ${tot}</span>`;
      b.querySelector('.t').textContent = s.t;
      b.onclick = () => start(s.k);
      const bk = document.createElement('button'); bk.type = 'button'; bk.className = 'book';
      bk.innerHTML = '📖<small>단어장</small>'; bk.setAttribute('aria-label', s.t + ' 단어장');
      bk.onclick = () => openBook(s.k);
      row.append(b, bk); wrap.appendChild(row);
    }
  }
}

/* ---------- 문제 고르기 ---------- */
// 복습할 때가 된 단어 → 익히는 중인 단어 → 새 단어(여러 곡에 나온 것부터) 순으로 섞는다
let STAGE = null;                                         // 지금 스테이지(없으면 전체에서 섞기)
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildQueue(){
  const pool = STAGE ? STAGE.ids.map(id => WORDS[id]) : WORDS;   // 스테이지면 그 곡 단어만, 가사에 나온 차례
  const now = Date.now(), due = [], doing = [], fresh = [];
  for(const w of pool){
    const r = ST.w[w.id];
    if(!r) fresh.push(w);
    else if(r.lv > 0 && r.due <= now) due.push(w);
    else if(r.lv === 0) doing.push(w);
  }
  due.sort((a, b) => ST.w[a.id].due - ST.w[b.id].due);
  const q = shuffle([...due.slice(0, 12), ...doing.slice(0, 10)]);
  // 새 단어는 차례를 지키며 사이사이에 끼운다(스테이지면 가사 순서대로 만난다)
  let pos = 0;
  for(const w of fresh.slice(0, Math.max(4, 16 - q.length))){
    pos = Math.min(q.length, pos + 1 + (Math.random() * 2 | 0)); q.splice(pos, 0, w); pos++;
  }
  if(!q.length) q.push(...shuffle(pool.slice()).slice(0, 20));   // 다 익힌 스테이지: 연습으로 다시
  const bm = shuffle(pool.filter(w => ST.bm[w.id])).slice(0, 8);  // 🔖 단어장에서 표시한 단어는 맨 앞에
  return [...bm, ...q.filter(w => !bm.includes(w))];
}
function pick(w){
  const seen = new Set([w.m]), out = [w.m];
  const pool = WORDS.filter(x => Math.abs(x.id - w.id) < 400);  // 비슷한 빈도의 단어에서
  while(out.length < 4){
    const x = (Math.random() < .8 ? pool : WORDS)[Math.random() * (Math.random() < .8 ? pool.length : WORDS.length) | 0];
    if(x && !seen.has(x.m)){ seen.add(x.m); out.push(x.m); }
  }
  for(let i = 3; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}

/* ---------- 소리 ---------- */
let AC = null, cur = null;
function ac(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }catch(_){} return AC; }
function beep(ok){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
  o.type = ok ? 'triangle' : 'square'; const t = c.currentTime;
  if(ok){ o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + .07); }
  else o.frequency.setValueAtTime(180, t);
  g.gain.setValueAtTime(ok ? .18 : .09, t); g.gain.exponentialRampToValueAtTime(.001, t + (ok ? .22 : .3));
  o.start(t); o.stop(t + .32);
}
function say(w){
  try{ if(cur){ cur.pause(); } }catch(_){}
  if(w.a){ cur = new Audio('audio/' + w.a); cur.play().catch(() => tts(w)); }
  else tts(w);
}
function tts(w){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w.r); u.lang = 'ja-JP'; u.rate = .9; speechSynthesis.speak(u);
}

/* ---------- 원곡 소절 ---------- */
let YT_READY = null, player = null, stopT = null;
function ytApi(){
  if(YT_READY) return YT_READY;
  YT_READY = new Promise(res => { window.onYouTubeIframeAPIReady = res;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); });
  return YT_READY;
}
// 🎵 를 누른 그 칸(예문·틀린 단어) 안에 영상을 펼쳐 그 줄만 재생한다. 한 번에 하나, 다시 누르면 닫힌다.
// 폰은 YouTube 가 자동 재생을 막아 영상의 ▶ 를 한 번 눌러야 한다(PC 는 바로 재생).
let songHost = null, songBtn = null;
async function playSong(ex, host, btn){
  if(songHost === host){ stopSong(); return; }
  stopSong();
  const box = document.createElement('div'); box.className = 'yt'; const el = document.createElement('div'); box.appendChild(el); host.appendChild(box);
  songHost = host; songBtn = btn; btn.textContent = '■'; btn.setAttribute('aria-pressed', 'true');
  box.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  await ytApi();
  if(songHost !== host) return;                            // 기다리는 사이 닫혔다
  const s = Math.max(0, ex.s - .3), e = ex.e + .4;
  player = new YT.Player(el, {videoId: ex.v,
    playerVars: {playsinline: 1, rel: 0, modestbranding: 1, autoplay: 1, start: Math.floor(s), end: Math.ceil(e)},
    events: {onReady: ev => { try{ ev.target.loadVideoById({videoId: ex.v, startSeconds: s, endSeconds: e}); }catch(_){} }}});
}
function stopSong(){
  try{ if(player) player.destroy(); }catch(_){} player = null;
  if(songHost){ const b = songHost.querySelector('.yt'); if(b) b.remove(); }
  if(songBtn){ songBtn.textContent = '🎵'; songBtn.setAttribute('aria-pressed', 'false'); }
  songHost = songBtn = null;
}

/* ---------- 한 판: 목숨 3 · 문제마다 5초 ---------- */
const LIVES = 3, QT = 5;
let Q, w, qLeft, qMax = QT, tick, score, combo, best, right, gainedNow, paused, clearedBefore, lives, missed, busy;
function paintLives(){ $('lives').innerHTML = [0, 1, 2].map(i => i < lives ? '❤️' : '<span class="off">❤️</span>').join(''); }
function paintQ(){
  const f = Math.max(0, qLeft / qMax), q = $('qbar');
  q.firstElementChild.style.width = (f * 100) + '%';
  q.classList.toggle('mid', f <= .6 && f > .3); q.classList.toggle('low', f <= .3);
}
function start(k){
  ac();
  STAGE = k ? stageOf(k) : null; ST.last = k || ''; save();
  clearedBefore = STAGE ? stageLearned(STAGE) >= STAGE.ids.length : false;
  $('pStage').textContent = STAGE ? STAGE.t : '전체 곡에서 섞기';
  Q = buildQueue(); score = 0; combo = 0; best = 0; right = 0; gainedNow = 0; lives = LIVES; missed = []; paused = true; busy = false;
  $('home').hidden = true; $('end').hidden = true; $('browse').hidden = true; $('play').hidden = false;
  $('score').textContent = 0; $('combo').textContent = ''; paintLives();
  clearInterval(tick); tick = setInterval(() => {
    if(paused || busy) return;
    qLeft -= .1; paintQ();
    if(qLeft <= 0) answer(null, false);                   // 시간 다 됨 = 틀림
  }, 100);
  next();
}
function next(){
  if(!Q.length) Q = buildQueue();
  w = Q.shift(); const r = rec(w.id);
  $('word').textContent = w.w;
  $('reading').textContent = w.r;
  $('stars').innerHTML = [0, 1, 2].map(i => i < r.s ? '★' : '<span class="off">★</span>').join('');
  const kj = $('kj'); kj.className = 'kj wait';
  kj.innerHTML = (w.k || []).map(([c, h]) => `<span><b lang="ja">${c}</b>${h}</span>`).join('');
  $('flash').className = 'flash';
  const box = $('choices'); box.innerHTML = '';
  for(const m of pick(w)){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ch'; b.textContent = m;
    b.onclick = () => answer(b, m === w.m); box.appendChild(b);
  }
  // ★0 단어·읽기 → ★1 읽기 숨김 → ★2 소리만(글자도 숨김, 1.5초 더 준다). 답하면 다 보인다
  const step = Math.min(r.s, 2);
  $('card').classList.toggle('hideR', step === 1); $('card').classList.toggle('ear', step === 2);
  $('lvl').textContent = ['', '읽기 없이', '👂 소리만 듣고'][step];
  qMax = QT + (step === 2 ? 1.5 : 0);
  qLeft = qMax; paintQ(); busy = false; paused = false;
  say(w);
}
function tone(freq, type, len, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination);
  o.type = type; const t0 = c.currentTime; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + len); o.start(t0); o.stop(t0 + len + .02);
}
function okSound(){                                       // 콤보마다 한 음씩 올라간다
  const step = Math.min(combo - 1, 12), f = 660 * Math.pow(2, step / 12);
  tone(f, 'triangle', .14, .18); setTimeout(() => tone(f * 1.5, 'triangle', .16, .14), 70);
}
function answer(btn, ok){
  if(busy) return; busy = true;
  const r = rec(w.id); r.seen++;
  document.querySelectorAll('.ch').forEach(b => { b.disabled = true; if(b.textContent === w.m) b.classList.add('ok'); });
  $('kj').className = 'kj';                                // 탭한 뒤에 한자 훈음
  $('card').classList.remove('hideR', 'ear'); $('lvl').textContent = '';
  if(ok){
    right++; combo++; best = Math.max(best, combo); okSound();
    const bonus = Math.round(Math.min(QT, Math.max(0, qLeft)) * 4);   // 빨리 맞힐수록 +최대 20
    const pts = (10 + bonus) * (1 + Math.floor(combo / 5));
    score += pts; $('score').textContent = score;
    const fl = $('float'); fl.textContent = '+' + pts; fl.classList.remove('fly'); void fl.offsetWidth; fl.classList.add('fly');
    r.s++;
    if(r.s >= NEED){
      if(r.lv === 0){ gainedNow++; ST.day[today()] = (ST.day[today()] || 0) + 1; }
      r.lv = Math.min(r.lv + 1, GAPS.length); r.s = 0; r.due = Date.now() + GAPS[r.lv - 1] * DAY;
    } else Q.splice(Math.min(Q.length, 3 + (Math.random() * 3 | 0)), 0, w);
    const c = $('combo'); c.textContent = combo >= 2 ? `🔥 ${combo}` : ''; c.classList.remove('pop'); void c.offsetWidth; if(combo >= 2) c.classList.add('pop');
    $('flash').textContent = combo >= 5 ? `🔥 ${combo}콤보!` : '정답!'; $('flash').className = 'flash ok';
    save(); setTimeout(next, (w.k && w.k.length) ? 750 : 450);
  } else {
    tone(180, 'square', .28, .09); try{ navigator.vibrate && navigator.vibrate(150); }catch(_){}
    if(btn) btn.classList.add('no');
    combo = 0; $('combo').textContent = ''; lives--; paintLives();
    const cd = $('card'); cd.classList.remove('shake'); void cd.offsetWidth; cd.classList.add('shake');
    $('flash').textContent = (btn ? '' : '⏰ 시간 끝 · ') + '정답 ' + w.m; $('flash').className = 'flash no';
    r.s = 0; if(r.lv > 0){ r.lv--; r.due = 0; }
    if(!missed.includes(w)) missed.push(w);
    Q.splice(Math.min(Q.length, 2), 0, w);
    save(); setTimeout(() => lives <= 0 ? finish() : next(), 1300);   // 1초 남짓 보여 주고 자동으로
  }
}
$('spk').onclick = () => say(w);
function lineAt(si, n){                                  // 스테이지 si 의 n 번째 줄
  const st = STAGES[si], L = st.L[n];
  return {s: L[0], e: L[1], t: L[2], ko: L[3], rd: L[4], rb: L[5] || '', v: st.v, song: st.t};   // L = [시작, 끝, 줄, 한국어 뜻, 읽기]
}
function exOf(w, st){                                     // 그 곡의 줄, 없으면 단어가 처음 나온 곡의 줄
  const si = st ? STAGES.indexOf(st) : -1;
  if(si >= 0 && w.x && w.x[si] != null) return lineAt(si, w.x[si]);
  return w.ex ? lineAt(w.ex[0], w.ex[1]) : null;
}
function finish(){
  clearInterval(tick); paused = true; stopSong();
  if(best > ST.best) ST.best = best;
  ST.bs = ST.bs || {}; const key = STAGE ? STAGE.k : '*', prev = ST.bs[key] || 0;
  if(score > prev) ST.bs[key] = score;
  save();
  $('play').hidden = true; $('end').hidden = false; window.scrollTo(0, 0);
  $('eScore').innerHTML = score + '<small>점</small>';
  const rc = $('eRecord');
  if(score > prev && prev > 0){ rc.className = 'record'; rc.textContent = `🏆 신기록! (전 ${prev}점)`; }
  else if(score > prev){ rc.className = 'record'; rc.textContent = '🏆 첫 기록!'; }
  else { rc.className = 'record plain'; rc.textContent = `최고 기록 ${prev}점`; }
  const g = $('eGain'); g.className = 'gain' + (gainedNow ? '' : ' zero');
  g.textContent = gainedNow ? `새로 익힌 단어 +${gainedNow}` : '세 번 연달아 맞히면 「익힘」이 됩니다';
  $('eRight').textContent = right; $('eCombo').textContent = best;
  $('eStage').textContent = STAGE ? STAGE.t : '전체 곡에서 섞기';
  const tot = STAGE ? STAGE.ids.length : WORDS.length, k = STAGE ? stageLearned(STAGE) : learned();
  $('eTotal').textContent = k; $('eTotalL').textContent = STAGE ? '이 곡 익힘' : '누적 익힘';
  $('eBar').style.width = (k / tot * 100).toFixed(1) + '%';
  $('eBarLbl').innerHTML = `<span style="color:var(--fire);letter-spacing:2px">${starsHtml(k, tot)}</span> ${k} / ${tot}`;
  $('eClear').hidden = !(STAGE && !clearedBefore && k >= tot);
  // 틀린 단어 다시 보기 — 소리 · 노래·영상의 그 줄
  const ml = $('eMiss'); ml.innerHTML = missed.length ? '<h3>틀린 단어 다시 보기</h3>' : '';
  for(const x of missed){
    const d = document.createElement('div'); d.className = 'mi';
    d.innerHTML = `<div lang="ja"><b></b><small></small></div><button type="button">🔊</button><button type="button">🎵</button><div class="mm"></div>`;
    d.querySelector('b').textContent = x.w; d.querySelector('small').textContent = x.r;
    d.querySelector('.mm').textContent = x.m + ((x.k || []).length ? ' · ' + x.k.map(([c, h]) => c + ' ' + h).join(' · ') : '');
    const [bs, bm] = d.querySelectorAll('button'); const ex = exOf(x, STAGE);
    bs.onclick = () => say(x);
    if(ex){ bm.title = ex.t; bm.onclick = () => playSong(ex, d, bm); } else bm.remove();
    ml.appendChild(d);
  }
}

/* ---------- 단어장: 곡의 단어를 차례대로 훑어보기 · 듣기 ---------- */
let BOOK = null, bTimer = null, bPos = -1, SEQ = [];
const bAudio = new Audio();                                // 하나를 돌려 써야 폰에서 이어 재생이 막히지 않는다
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
const BM_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>';
const FOLD_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
// 예문: 한자 위 읽기(「{君|きみ}が…」) + 그 단어에 밑줄
function exHtml(ex, word){
  const at = ex.t.indexOf(word), end = at + word.length, parts = [];
  if(ex.rb){ const re = /\{([^|}]+)\|([^}]+)\}|([^{]+)/g; let m; while((m = re.exec(ex.rb))) parts.push(m[3] != null ? [m[3], ''] : [m[1], m[2]]); }
  else parts.push([ex.t, '']);
  let pos = 0, h = '';
  for(const [b, r] of parts){
    const s0 = pos, s1 = pos + b.length; pos = s1;
    if(r){
      const x = `<ruby>${esc(b)}<rt>${esc(r)}</rt></ruby>`;
      h += at >= 0 && s0 < end && s1 > at ? `<mark>${x}</mark>` : x;
    } else {
      const a = Math.max(s0, at), z = Math.min(s1, end);
      h += at < 0 || a >= z ? esc(b) : esc(b.slice(0, a - s0)) + '<mark>' + esc(b.slice(a - s0, z - s0)) + '</mark>' + esc(b.slice(z - s0));
    }
  }
  return h;
}
function openBook(k){
  BOOK = stageOf(k); ST.last = k; save();
  $('home').hidden = true; $('browse').hidden = false; window.scrollTo(0, 0);
  $('bTitle').textContent = BOOK.t;
  const list = $('bList'); list.innerHTML = '';
  BOOK.ids.forEach((id, i) => {
    const w = WORDS[id], r = ST.w[id], known = !!(r && r.lv > 0), ex = exOf(w, BOOK);
    const d = document.createElement('div'); d.className = 'bw' + (known ? ' known' : ''); d.id = 'bw' + i;
    d.innerHTML = `<div class="bh"><span class="no">단어 ${i + 1}</span><button type="button" class="bm" aria-pressed="${!!ST.bm[id]}" aria-label="헷갈려요 표시">${BM_SVG}</button></div>
      <div class="w" lang="ja"></div>
      <div class="rrow"><button type="button" class="spk1" aria-label="읽기 듣기">🔊</button><div class="r" lang="ja"></div>
       <button type="button" class="fold" aria-expanded="false" aria-label="뜻 보기">${FOLD_SVG}</button></div>
      <div class="body"><div class="m"></div><div class="kj"></div>${ex ? `<div class="ex">
        <div class="ej" lang="ja"></div><div class="er" lang="ja"></div><div class="ek"></div>
        <button type="button" class="song" aria-label="원곡에서 듣기">🎵</button><div class="src" lang="ja"></div></div>` : ''}
       <button type="button" class="know" aria-pressed="${known}">${known ? '✓ 익힘' : '✓ 알아요'}</button></div>`;
    d.querySelector('.w').textContent = w.w;
    d.querySelector('.r').textContent = w.r;
    d.querySelector('.m').textContent = w.m;
    d.querySelector('.kj').innerHTML = (w.k || []).map(([c, h]) => `<span><b lang="ja">${c}</b>${h}</span>`).join('');
    if(ex){
      d.querySelector('.ej').innerHTML = exHtml(ex, w.w);
      if(ex.rb) d.querySelector('.er').remove();             // 한자 위에 읽기가 있으면 아래 줄은 뺀다
      else d.querySelector('.er').textContent = ex.rd;
      d.querySelector('.ek').textContent = ex.ko;
      d.querySelector('.src').textContent = ex.song === BOOK.t ? '' : '♪ ' + ex.song;
      const sb = d.querySelector('.song'); sb.onclick = () => { bStop(); playSong(ex, d.querySelector('.ex'), sb); };
    }
    const fold = d.querySelector('.fold'), toggle = () => { const o = d.classList.toggle('open'); fold.setAttribute('aria-expanded', o); };
    fold.onclick = toggle; d.querySelector('.w').onclick = toggle; d.querySelector('.r').onclick = toggle;
    d.querySelector('.spk1').onclick = () => { bStop(); bSay(w); };
    d.querySelector('.bm').onclick = e => {
      const b = e.currentTarget, on = !ST.bm[id];
      if(on) ST.bm[id] = 1; else delete ST.bm[id];
      b.setAttribute('aria-pressed', on); save();
    };
    d.querySelector('.know').onclick = e => toggleKnown(w, d, e.currentTarget);
    list.appendChild(d);
  });
  paintOpen();
}
// 뜻은 접어 두고 떠올려 본 뒤 펼친다 — 한꺼번에 훑고 싶으면 「뜻 모두 펼치기」(기억함)
function paintOpen(){ $('bList').classList.toggle('all', OPT.open); $('bOpen').setAttribute('aria-pressed', OPT.open); $('bOpen').textContent = OPT.open ? '접기' : '펼치기'; }
// 듣기 설정은 ⚙ 안에 접어 둔다 — 위가 카드를 가리지 않게
function setOpt(on){ $('bOpt').hidden = !on; $('bSet').setAttribute('aria-expanded', on); }
$('bSet').onclick = e => { e.stopPropagation(); setOpt($('bOpt').hidden); };
document.addEventListener('click', e => { if(!$('bOpt').hidden && !e.target.closest('#bOpt')) setOpt(false); });
function toggleKnown(w, d, btn){
  const r = rec(w.id);
  if(r.lv > 0){ r.lv = 0; r.s = 0; r.due = 0; }
  else { r.lv = 1; r.s = 0; r.due = Date.now() + DAY; ST.day[today()] = (ST.day[today()] || 0) + 1; }
  const on = r.lv > 0; btn.setAttribute('aria-pressed', on); btn.textContent = on ? '✓ 익힘' : '✓ 알아요';
  d.classList.toggle('known', on); save();
}
function bPlayFile(file, text, lang, done){
  bAudio.onended = bAudio.onerror = null;
  const fallback = () => { speakText(text, lang, done); };
  if(file){ bAudio.src = 'audio/' + file; bAudio.onended = () => done && done(); bAudio.onerror = fallback; bAudio.play().catch(fallback); }
  else fallback();
}
function speakText(text, lang, done){
  if(!('speechSynthesis' in window)){ done && setTimeout(done, 600); return; }
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .95;
  u.onend = () => done && done(); speechSynthesis.speak(u);
}
const meanSay = m => m.replace(/[（(][^）)]*[）)]/g, '').replace(/[~〜～]/g, '').replace(/\s*[·・/]\s*/g, ', ');
function bSay(w, done){ bPlayFile(w.a, w.r, 'ja-JP', done); }

// 듣기 설정 — 기억한다
let OPT = {rep: 1, mean: true, shadow: false, only: 'all', loop: false, open: false};
try{ Object.assign(OPT, JSON.parse(localStorage.getItem('wordtap.opt')) || {}); }catch(_){}
try{ if(localStorage.getItem('wordtap.mean') === '0') OPT.mean = false; }catch(_){}
if(OPT.todo){ OPT.only = 'todo'; delete OPT.todo; }          // 예전 「못 익힌 것만」 체크
function saveOpt(){ try{ localStorage.setItem('wordtap.opt', JSON.stringify(OPT)); }catch(_){} }
function paintOpt(){
  $('oRep').textContent = `🔁 ${OPT.rep}번씩`;
  $('bMean').checked = OPT.mean; $('oShadow').checked = OPT.shadow; $('oLoop').checked = OPT.loop;
  $('oOnly').textContent = ONLY[OPT.only];
}
const ONLY = {all: '📚 전체', todo: '🙈 못 익힌 것만', bm: '🔖 표시한 것만'};
$('oRep').onclick = () => { OPT.rep = OPT.rep % 3 + 1; saveOpt(); paintOpt(); };
$('oOnly').onclick = () => { const k = Object.keys(ONLY); OPT.only = k[(k.indexOf(OPT.only) + 1) % k.length]; saveOpt(); paintOpt(); };
$('bOpen').onclick = () => { OPT.open = !OPT.open; saveOpt(); paintOpen(); };
for(const [id, k] of [['bMean', 'mean'], ['oShadow', 'shadow'], ['oLoop', 'loop']])
  $(id).onchange = e => { OPT[k] = e.target.checked; saveOpt(); };
paintOpt();

// 화면이 꺼지지 않게(지원하는 브라우저에서) — 화면이 꺼지면 브라우저가 소리를 멈춘다
let wake = null;
async function wakeOn(){ try{ if('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); }catch(_){} }
function wakeOff(){ try{ wake && wake.release(); }catch(_){} wake = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && bPos >= 0) wakeOn(); });

function bStop(){
  clearTimeout(bTimer); bPos = -1; try{ bAudio.pause(); }catch(_){} try{ speechSynthesis.cancel(); }catch(_){}
  document.querySelectorAll('.bw.on').forEach(e => e.classList.remove('on', 'peek')); $('bPlay').textContent = '▶ 전부 듣기'; wakeOff();
}
function buildSeq(){
  return BOOK.ids.map((id, i) => i).filter(i => { const id = BOOK.ids[i];
    return OPT.only === 'todo' ? !(ST.w[id] && ST.w[id].lv > 0) : OPT.only === 'bm' ? !!ST.bm[id] : true; });
}
function bStep(pos){
  if(!BOOK) return;
  if(pos >= SEQ.length){
    if(OPT.loop){ SEQ = buildSeq(); if(SEQ.length) return bStep(0); }
    bStop(); return;
  }
  bPos = pos; const i = SEQ[pos], my = pos;
  document.querySelectorAll('.bw.on').forEach(e => e.classList.remove('on', 'peek'));
  const d = $('bw' + i); d.classList.add('on', 'peek'); d.scrollIntoView({block: 'center', behavior: 'smooth'});
  const w = WORDS[BOOK.ids[i]];
  $('vNow').textContent = w.w;
  const alive = () => bPos === my;
  const nextWord = () => { if(alive()) bTimer = setTimeout(() => bStep(pos + 1), 900); };
  const mean = () => { if(!alive()) return; if(!OPT.mean) return nextWord();
    bTimer = setTimeout(() => { if(alive()) bPlayFile(w.ma, meanSay(w.m), 'ko-KR', nextWord); }, 450); };
  let n = 0;
  const once = () => {                                     // 일본어를 rep 번, 따라하기면 그 길이만큼 쉰다
    if(!alive()) return;
    bSay(w, () => {
      if(!alive()) return; n++;
      const dur = isFinite(bAudio.duration) ? bAudio.duration * 1000 : 900;
      const gap = OPT.shadow ? Math.max(1300, dur * 1.4 + 300) : 450;
      bTimer = setTimeout(n < OPT.rep ? once : mean, n < OPT.rep ? gap : (OPT.shadow ? gap : 0));
    });
  };
  once();
}
$('bPlay').onclick = () => {
  if(bPos >= 0){ bStop(); return; }
  ac(); SEQ = buildSeq();
  if(!SEQ.length){ $('bPlay').textContent = OPT.only === 'bm' ? '🔖 표시한 단어가 없어요' : '▶ 다 익혔어요'; setTimeout(() => $('bPlay').textContent = '▶ 전부 듣기', 1400); return; }
  stopSong(); $('bPlay').textContent = '■ 멈춤'; wakeOn(); bStep(0);
};
$('bBack').onclick = () => { bStop(); stopSong(); $('browse').hidden = true; $('home').hidden = false; paintHome(); };
$('bGame').onclick = () => { bStop(); stopSong(); $('browse').hidden = true; start(BOOK.k); };

// 화면 잠금 — 듣는 동안 주머니 속 터치를 막는다. 2초 꾹 눌러 풀기(PC 는 Esc)
let holdT = null, holdS = 0, holdRaf = null;
$('bLock').onclick = () => { $('veil').hidden = false; wakeOn(); };
function unlock(){ $('veil').hidden = true; $('vHold').style.width = 0; if(bPos < 0) wakeOff(); }
function holdTick(){ const f = Math.min(1, (performance.now() - holdS) / 2000); $('vHold').style.width = (f * 100) + '%'; if(f < 1) holdRaf = requestAnimationFrame(holdTick); }
$('veil').addEventListener('pointerdown', e => { e.preventDefault(); holdS = performance.now(); holdTick(); holdT = setTimeout(unlock, 2000); });
for(const ev of ['pointerup', 'pointerleave', 'pointercancel'])
  $('veil').addEventListener(ev, () => { clearTimeout(holdT); cancelAnimationFrame(holdRaf); $('vHold').style.width = 0; });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('veil').hidden) unlock(); });

$('go').onclick = () => start(stageOf(ST.last) ? ST.last : '');
$('mix').onclick = () => start('');
$('again').onclick = () => start(STAGE ? STAGE.k : '');
$('toHome').onclick = () => { stopSong(); $('end').hidden = true; $('home').hidden = false; paintHome(); };
paintHome();
</script>
</body></html>
