<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#3b4a7a">
<title>First Love 블록 연습</title>
<style>
:root{--bg:#f4f5fa;--surface:#fff;--ink:#1d2230;--ink-2:#4a5266;--ink-3:#7c8498;--line:#e2e5ee;--brand:#3b4a7a;--brand-soft:#e9edf9;
 --hot:#e8590c;--hot-soft:#fdeee4;--b:#7a4a9b;--b-soft:#f2eaf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141b;--surface:#1a1e28;--ink:#e9ecf4;--ink-2:#b7bfd0;--ink-3:#8b93a7;--line:#2a3040;--brand:#9db0ee;--brand-soft:#232b40;--hot:#ff9b5e;--hot-soft:#3a2518;--b:#c9a3e6;--b-soft:#2c2338}}
:root[data-theme="dark"]{--bg:#11141b;--surface:#1a1e28;--ink:#e9ecf4;--ink-2:#b7bfd0;--ink-3:#8b93a7;--line:#2a3040;--brand:#9db0ee;--brand-soft:#232b40;--hot:#ff9b5e;--hot-soft:#3a2518;--b:#c9a3e6;--b-soft:#2c2338}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:760px;padding:max(14px,env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
a.back{color:var(--ink-3);font-size:13px;text-decoration:none}
/* 기능 이름 */
.eb{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--hot)}
h1{margin:2px 0 0;font-size:24px;line-height:1.2;text-wrap:balance}
.by{color:var(--ink-3);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.yt>div,.yt iframe{position:absolute;inset:0;width:100%;height:100%}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 13px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#11141b}}
.seg.lead{align-items:center}.seg.lead span{font-size:13px;font-weight:700;color:var(--ink-2);padding:0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.tog[aria-pressed="true"]{background:var(--hot-soft);border-color:var(--hot);color:var(--hot)}
.note{font-size:13px;color:var(--ink-3);line-height:1.55;margin:0}
.diags{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px 4px;text-align:center}
.dg b{display:block;font-size:17px}
.dg small{display:block;font-size:11px;color:var(--ink-3);min-height:1.2em}
.dg.on{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot-soft)}
.dg svg{width:70px;height:84px}
.dg .ln{stroke:var(--ink-3);stroke-width:1}.dg .nut{stroke:var(--ink)}
.dg .dot{fill:var(--ink)}.dg .open{fill:none;stroke:var(--ink);stroke-width:1.2}
.dg .mk,.dg .fr{font-size:9px;fill:var(--ink-2);text-anchor:middle}.dg .fr{text-anchor:start}
.prog{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-2)}
.prog b{font-size:16px;color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:48px repeat(4,1fr) 40px;gap:4px;align-items:stretch}
.row .tm{border:0;background:none;padding:0;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px}
.row .tm i{font-style:normal;font-weight:800;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand)}
.row.B .tm i{background:var(--b-soft);color:var(--b)}
.bar{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 4px;display:flex;justify-content:space-around;align-items:center;gap:2px;font-weight:800;font-size:16px;min-height:46px}
.bar span{min-width:0}
.bar.now{border-color:var(--hot);background:var(--hot-soft)}
.bar .h{color:var(--hot)}
.row .lp{border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:15px;padding:0}
.row .lp[aria-pressed="true"]{background:var(--hot-soft);border-color:var(--hot)}
.row.looping .bar{border-style:dashed}
.foot{font-size:12px;color:var(--ink-3);line-height:1.6}
/* 화면 아래 재생 막대 — 아래로 내려가 코드를 볼 때도 멈추고 이어 듣는다 */
.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
 box-shadow:0 -6px 18px #0000001a;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{width:100%;max-width:760px;display:flex;align-items:center;gap:12px}
.pp{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pp{color:#11141b}}
:root[data-theme="dark"] .pp{color:#11141b}
.pp svg{width:24px;height:24px;fill:currentColor}
.dock .now{display:flex;flex-direction:column;min-width:0}
.dock .now b{font-size:26px;line-height:1.1;color:var(--hot);font-variant-numeric:tabular-nums}
.dock .now small{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lb{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:800;color:var(--ink-2)}
.lb[aria-pressed="true"]{background:var(--hot-soft);border-color:var(--hot);color:var(--hot)}
.bar.lp1{outline:2.5px solid var(--hot);outline-offset:2px}
.dock .nx{margin-left:auto;text-align:right;font-size:12.5px;color:var(--ink-3)}
.dock .nx b{display:block;font-size:17px;color:var(--ink-2)}
@media (max-width:420px){.bar{font-size:14px;padding:9px 2px}.row{grid-template-columns:40px repeat(4,1fr) 34px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

const $ = id => document.getElementById(id);
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let MODE = 'shape', LOOP = -1, player = null, cur = -1, LB = -1;   // LB = 반복 중인 칸(flat 번호)
const KEY = D.store || 'blocks';
// ⏱ 앞당김: 블록 강조를 실제 재생 시각보다 이만큼 먼저 넘긴다. 폰의 YouTube 가 알려 주는 시각이 소리보다 늦고,
// 다음 코드를 먼저 봐야 손을 옮길 수 있어서(First Love 「조금씩 늦다」). 반복 구간은 실제 시각 그대로 쓴다.
let LEAD = 0.2;
try{ const v = parseFloat(localStorage.getItem('blocks.lead')); if(!isNaN(v)) LEAD = v; }catch(_){}
try{ MODE = localStorage.getItem(KEY + '.mode') || 'shape'; }catch(_){}
if(D.back){ $('back').href = D.back[0]; $('back').textContent = '‹ ' + D.back[1]; }
$('note2').textContent = D.note || ''; $('src').textContent = D.src || '';
$('title').textContent = D.title; $('by').textContent = D.artist;
$('meta').innerHTML = [`${D.key} ${D.mode === 'major' ? '장조' : '단조'}`, `${D.bpm} BPM`, (D.capo ? `카포 ${D.capo} · ${D.form} 모양` : '카포 없음'), `${D.rows.reduce((n, r) => n + r.length, 0)}블록`].map(x => `<span>${x}</span>`).join('');
$('fit').textContent = D.fit;
const nm = c => (MODE === 'shape' ? D.shape : D.real)[c];

function paint(){
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === MODE));
  $('capoNote').textContent = MODE === 'shape'
    ? (D.capo ? `카포를 ${D.capo}프렛에 끼우고 아래 모양으로 잡으면 원래 소리(${D.key})가 납니다. 바레 코드 없이 칠 수 있습니다.`
              : `카포 없이 아래 모양 그대로 원래 소리(${D.key})입니다.`)
    : `원래 코드(카포 없이). ${D.key} 조라 바레 코드가 많습니다 — 「카포 모양」을 권합니다.`;
  $('diags').innerHTML = D.order.map(c => `<div class="dg" data-c="${c}"><b>${nm(c)}</b><small>${MODE === 'shape' ? '소리 ' + D.real[c] : ''}</small>${D.diag[nm(c)] || ''}</div>`).join('');
  // 기본 진행 = 가장 많이 나오는 4마디 줄
  const cnt = {}; D.rows.forEach(r => { const k = r.map(b => b[2].join(' ')).join(' | '); cnt[k] = (cnt[k] || 0) + 1; });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  const seq = []; top[0].split(/ \| | /).forEach(c => { if(seq[seq.length - 1] !== c) seq.push(c); });
  $('prog').innerHTML = `가장 많이 나오는 줄(${top[1]}번): ` + seq.map(c => `<b>${nm(c)}</b>`).join(' → ');
  const box = $('rows'); box.innerHTML = '';
  D.rows.forEach((r, i) => {
    const row = document.createElement('div'); row.className = 'row ' + ((D.labels || [])[i] || '') + (LOOP === i ? ' looping' : ''); row.id = 'r' + i;
    row.innerHTML = `<button type="button" class="tm" aria-label="${fmt(r[0][0])}부터 재생">${D.labels && D.labels[i] ? `<i>${D.labels[i]}</i>` : ''}${fmt(r[0][0])}</button>` +
      r.map((b, j) => `<div class="bar" id="b${i}_${j}">${b[2].map(c => `<span>${nm(c)}</span>`).join('')}</div>`).join('') +
      '<div class="bar" style="visibility:hidden"></div>'.repeat(4 - r.length) +
      `<button type="button" class="lp" aria-pressed="${LOOP === i}" aria-label="이 줄 반복">🔁</button>`;
    row.querySelector('.tm').onclick = () => seek(r[0][0]);
    // 재생 중인 블록을 다시 누르면 멈춤 · 멈춘 블록을 누르면 그 자리부터 이어서 · 다른 블록은 그 마디부터
    row.querySelectorAll('.bar[id]').forEach((el, j) => el.onclick = () => {
      if(el.classList.contains('now') && player && player.pauseVideo){ if(playing()) player.pauseVideo(); else player.playVideo(); }
      else { if(LB >= 0) setLB(flat.findIndex(b => b[2] === i && b[3] === j)); seek(r[j][0]); }
    });
    row.querySelector('.lp').onclick = () => { LOOP = LOOP === i ? -1 : i; setLB(-1); paint(); if(LOOP === i) seek(r[0][0]); };
    box.appendChild(row);
  });
  if(LB >= 0) $(`b${flat[LB][2]}_${flat[LB][3]}`).classList.add('lp1');   // 다시 그려도 칸 반복 표시 유지
  cur = -1;
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { MODE = b.dataset.v; try{ localStorage.setItem(KEY + '.mode', MODE); }catch(_){} paint(); });
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', x === b));
  try{ player && player.setPlaybackRate(Number(b.dataset.v)); }catch(_){}
});

const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
function playing(){ try{ return player && player.getPlayerState() === 1; }catch(_){ return false; } }
function paintPP(){ const on = playing(); $('ppIcon').innerHTML = on ? PAUSE : PLAY; $('pp').setAttribute('aria-label', on ? '일시정지' : '재생'); }
$('pp').onclick = () => { if(!player || !player.playVideo) return; if(playing()) player.pauseVideo(); else player.playVideo(); };
document.addEventListener('keydown', e => {
  if(e.code !== 'Space' || /INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) return;
  e.preventDefault(); $('pp').click();
});
// 🔁 이 칸 — 지금 재생 중인 마디 하나만 되풀이(다시 누르면 끔)
function setLB(k){
  LB = k; document.querySelectorAll('.bar.lp1').forEach(x => x.classList.remove('lp1'));
  if(k >= 0){ $(`b${flat[k][2]}_${flat[k][3]}`).classList.add('lp1'); if(LOOP >= 0){ LOOP = -1; paint(); setLB(k); return; } }
  $('lb').setAttribute('aria-pressed', k >= 0);
}
$('lb').onclick = () => { if(LB >= 0) setLB(-1); else if(cur >= 0) setLB(cur); else if(flat.length) { setLB(0); seek(flat[0][0]); } };
function seek(t){ if(!player || !player.seekTo) return; player.seekTo(Math.max(0, t + .02), true); player.playVideo(); }

// 재생 위치 → 지금 마디 강조 · 줄 반복
const flat = []; D.rows.forEach((r, i) => r.forEach((b, j) => flat.push([b[0], b[1], i, j, b[2]])));
function paintLead(){ $('leadV').textContent = `⏱ ${LEAD.toFixed(1)}초 앞`; }
function setLead(v){ LEAD = Math.round(Math.min(.8, Math.max(0, v)) * 10) / 10; try{ localStorage.setItem('blocks.lead', LEAD); }catch(_){} paintLead(); cur = -2; }
$('leadM').onclick = () => setLead(LEAD - .1); $('leadP').onclick = () => setLead(LEAD + .1); paintLead();
function tick(){
  if(!player || !player.getCurrentTime) return;
  let t; try{ t = player.getCurrentTime(); }catch(_){ return; }
  if(LB >= 0){
    const [s, e] = flat[LB];
    if(t >= e - .04 || t < s - 1) { player.seekTo(s, true); return; }
  } else if(LOOP >= 0){
    const r = D.rows[LOOP], s = r[0][0], e = r[r.length - 1][1];
    if(t >= e - .05 || t < s - 1) { player.seekTo(s, true); return; }
  }
  const tv = t + LEAD;                                     // 강조·막대는 앞당긴 시각으로
  const k = flat.findIndex(b => b[0] <= tv && tv < b[1]);
  // 막대: 지금 코드 · 시각 · 다음 코드
  let dur = 0; try{ dur = player.getDuration(); }catch(_){}
  $('nowT').textContent = `${fmt(t)} / ${fmt(dur || 0)}`;
  if(k >= 0){
    const [s, e, , , cs] = flat[k], second = cs.length > 1 && tv >= s + (e - s) / 2;
    $('nowC').textContent = nm(second ? cs[1] : cs[0]);
    const nxt = second || cs.length < 2 ? (flat[k + 1] ? flat[k + 1][4][0] : null) : cs[1];
    $('nextC').textContent = nxt ? nm(nxt) : '—';
  }
  if(k === cur) return;
  document.querySelectorAll('.bar.now').forEach(x => x.classList.remove('now'));
  document.querySelectorAll('.dg.on').forEach(x => x.classList.remove('on'));
  cur = k; if(k < 0) return;
  const [s, e, i, j, cs] = flat[k], el = $(`b${i}_${j}`);
  el.classList.add('now');
  // 지금 울리는 코드(반 마디)에 맞춰 운지 그림도 표시
  const c = cs.length > 1 && tv >= s + (e - s) / 2 ? cs[1] : cs[0];
  const dg = document.querySelector(`.dg[data-c="${CSS.escape(c)}"]`); if(dg) dg.classList.add('on');
  const rect = el.getBoundingClientRect();
  if(rect.top < 80 || rect.bottom > innerHeight - 20) el.scrollIntoView({block: 'center', behavior: 'smooth'});
}
setInterval(() => { const k = cur; tick(); if(k === cur && cur >= 0){ /* 반 마디가 바뀌면 운지 갱신 */
  const [s, e, , , cs] = flat[cur]; if(cs.length > 1){ let t; try{ t = player.getCurrentTime() + LEAD; }catch(_){ return; }
    const c = t >= s + (e - s) / 2 ? cs[1] : cs[0];
    document.querySelectorAll('.dg.on').forEach(x => { if(x.dataset.c !== c) x.classList.remove('on'); });
    const dg = document.querySelector(`.dg[data-c="${CSS.escape(c)}"]`); if(dg) dg.classList.add('on'); } } }, 50);   // 0.05초마다

paint();
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {videoId: D.vid, playerVars: {playsinline: 1, rel: 0, modestbranding: 1}, events: {onStateChange: paintPP}});
};
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body></html>
